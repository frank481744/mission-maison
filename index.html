<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mission Maison</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission Maison">
<style>
:root{--card:#111827;--line:#334155;--text:#f8fafc;--muted:#cbd5e1;--yellow:#fbbf24;--green:#22c55e;--red:#ef4444;--blue:#38bdf8;--orange:#fb923c;--purple:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#0f172a,#0b1220);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}.wrap{max-width:1000px;margin:auto;padding:16px 14px 84px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:27px;font-weight:950}.sub,.small{color:var(--muted);font-size:13px}.sync{font-size:12px;color:#bae6fd;margin-top:3px}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#172033;color:white;border-radius:999px;padding:10px 13px;font-weight:900}.tab.on{background:var(--yellow);color:#111827}
.card{background:rgba(17,24,39,.96);border:1px solid var(--line);border-radius:20px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.child{width:100%;text-align:left;color:white;position:relative}.child.on{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow) inset}.avatar{font-size:40px}.name{font-size:19px;font-weight:950}.summary{font-size:12px;color:#cbd5e1;margin-top:4px}
.scorePos{color:#86efac;font-weight:900}.scoreNeg{color:#fca5a5;font-weight:900}.timerBadge{position:absolute;right:10px;top:10px;background:#7f1d1d;color:#fecaca;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:950}
.event,.instruction,.timerBox,.settingRow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#121a2a;border-radius:16px;padding:12px;margin:9px 0}.emoji{font-size:27px}.grow{flex:1;min-width:0}.title{font-size:16px;font-weight:950}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:12px;padding:9px 11px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.big{width:100%;padding:13px;margin-top:9px}
.primary{background:var(--yellow);color:#111827}.success{background:var(--green);color:#052e16}.danger{background:var(--red);color:white}.secondary{background:#263244;color:white;border:1px solid #475569}.orange{background:var(--orange);color:#431407}.purple{background:var(--purple);color:#211044}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.form input,.form select,.form textarea,.cloud input{width:100%;background:#0b1322;color:white;border:1px solid var(--line);border-radius:11px;padding:10px}.cloud input{margin:5px 0}.form textarea{min-height:74px;resize:vertical}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick .btn{min-height:52px;text-align:left}.coachGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}.coachGrid .btn{text-align:left;min-height:48px}
.notice{border:1px dashed #475569;background:#0b1322;border-radius:14px;padding:11px;color:#cbd5e1}.notice.warn{border-color:#92400e;background:#25170a;color:#fed7aa}.notice.good{border-color:#166534;background:#082b18;color:#bbf7d0}.pill{background:#263244;border-radius:99px;padding:5px 8px;font-size:12px;font-weight:900}.stat{display:flex;justify-content:space-between;gap:8px;align-items:center}.code{text-align:center;color:var(--yellow);font-size:30px;font-weight:950;letter-spacing:4px;padding:10px}
.verdict{font-size:20px;font-weight:950;padding:12px;border-radius:14px;background:#0b1322;border:1px solid #334155;margin:10px 0}.status{display:inline-block;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900;margin-top:6px}.pending{background:#0c4a6e;color:#bae6fd}.done{background:#14532d;color:#bbf7d0}.bad{background:#7f1d1d;color:#fecaca}.neutral{background:#334155;color:#e2e8f0}.locked{background:#3f3f46;color:#e4e4e7}
.timerClock{font-size:31px;font-weight:950;color:#fca5a5;letter-spacing:1px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.deltaUp{color:#86efac;font-weight:900}.deltaDown{color:#fca5a5;font-weight:900}.deltaSame{color:#cbd5e1;font-weight:900}
h2,h3{margin:5px 0 11px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#020617;border:1px solid #475569;border-radius:13px;padding:11px 15px;font-weight:850;z-index:9999;max-width:90vw;text-align:center}.hidden{display:none}.installBox{margin:12px 0}.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:20px}
.undo{position:fixed;right:14px;bottom:18px;z-index:999;background:#f8fafc;color:#0f172a;border:0;border-radius:999px;padding:12px 15px;font-weight:950;box-shadow:0 8px 30px #0008}.undo:disabled{opacity:.45}.coachBox{border:1px solid #6d28d9;background:#1d1234;border-radius:16px;padding:13px;margin-top:10px}.coachTitle{font-weight:950;color:#ddd6fe;margin-bottom:7px}.coachSteps{margin:0;padding-left:20px;color:#ede9fe}.coachSteps li{margin:5px 0}.contextline{color:#cbd5e1;font-size:12px;margin-top:5px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#94a3b8;font-size:11px;font-weight:900;padding:5px}.calDay{min-height:61px;border:1px solid #334155;border-radius:11px;background:#121a2a;color:white;padding:6px;text-align:left;position:relative}.calDay.empty{opacity:.15}.calDay.green{background:#0d3a25;border-color:#166534}.calDay.orange{background:#3a260d;border-color:#92400e}.calDay.red{background:#3a1010;border-color:#991b1b}.calDay.gray{background:#1f2937}.calDay.today{box-shadow:0 0 0 2px #fbbf24 inset}.calNum{font-weight:950}.calScore{font-size:11px;position:absolute;bottom:5px;right:6px}.goal{border-left:4px solid #a78bfa;padding-left:10px}.rewardUnlocked{border-color:#166534;background:#082b18;color:#bbf7d0}.rewardLocked{border-color:#475569;background:#111827;color:#cbd5e1}.closeSummary{white-space:pre-line}.mini{font-size:11px;color:#94a3b8}
@media(max-width:600px){.brand{font-size:23px}.quick{grid-template-columns:1fr}.stat{align-items:flex-start}.timerClock{font-size:27px}.calendar{gap:3px}.calDay{min-height:52px;padding:5px}.tabs .tab{padding:9px 10px;font-size:13px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const STORE="missionMaisonV2",OLD="mission-maison-v1",PROF="missionMaisonCloudV1",ACTIVE="missionMaisonActive";
const API_DEFAULT="https://budget-pack-api.2ywtpfbvpb.workers.dev";
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,"0");
const day=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromDay=s=>new Date(s+"T12:00:00");
const addDays=(s,n)=>{const d=fromDay(s);d.setDate(d.getDate()+n);return day(d)};
const monthKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const monthFromKey=k=>new Date(k+"-01T12:00:00");

const GOALS={
 first:{label:"Faire les consignes sans rappel",icon:"✅"},
 lessArgue:{label:"Moins s'obstiner",icon:"😤"},
 spontaneous:{label:"Aider sans qu'on demande",icon:"🌟"},
 respect:{label:"Parler avec respect",icon:"❤️"},
 lessRepeat:{label:"Moins avoir besoin de rappels",icon:"⚠️"},
 none:{label:"Aucun objectif particulier",icon:"🎯"}
};

const base={
 schemaVersion:2,settings:{app:"mission-maison",behaviorMode:true,lockReports:true},parentPin:"1234",
 children:[
  {id:"c1",name:"Dylan",avatar:"🦸",points:0,goalKey:"first",weeklyReward:"",rewardMinScore:5,timerPresets:[5,10,15,20]},
  {id:"c2",name:"Nolan",avatar:"🦖",points:0,goalKey:"first",weeklyReward:"",rewardMinScore:5,timerPresets:[5,10,15,20]},
  {id:"c3",name:"Enfant 3",avatar:"🦄",points:0,goalKey:"none",weeklyReward:"",rewardMinScore:5,timerPresets:[5,10,15,20]},
  {id:"c4",name:"Enfant 4",avatar:"🐼",points:0,goalKey:"none",weeklyReward:"",rewardMinScore:5,timerPresets:[5,10,15,20]},
  {id:"c5",name:"Enfant 5",avatar:"🐯",points:0,goalKey:"none",weeklyReward:"",rewardMinScore:5,timerPresets:[5,10,15,20]},
  {id:"c6",name:"Enfant 6",avatar:"🦊",points:0,goalKey:"none",weeklyReward:"",rewardMinScore:5,timerPresets:[5,10,15,20]}
 ],
 behaviorEvents:[],instructions:[],punishments:[],dayClosures:[],updatedAt:now()
};

const BEHAVIORS={
 spontaneous:{icon:"🌟",label:"A aidé sans qu'on demande",score:3,coach:"praise"},
 kind:{icon:"❤️",label:"Beau geste",score:2,coach:"praise"},
 first:{icon:"✅",label:"A écouté / fait du premier coup",score:2,coach:"praise"},
 help:{icon:"🤝",label:"A aidé après demande",score:1,coach:"praise"},
 repeat:{icon:"⚠️",label:"A fallu répéter",score:-1,coach:"repeat"},
 argue:{icon:"😤",label:"S'est obstiné",score:-2,coach:"argue"},
 disrespect:{icon:"🗯️",label:"Manque de respect",score:-3,coach:"disrespect"},
 bad:{icon:"👎",label:"Mauvais comportement",score:-2,coach:"general"}
};

const OUTCOMES={
 first:{icon:"✅",label:"Fait sans rappel",score:2,coach:"praise"},
 one:{icon:"🙂",label:"Fait après 1 rappel",score:1,coach:"praise"},
 many:{icon:"⚠️",label:"Fait après plusieurs rappels",score:-1,coach:"repeat"},
 notdone:{icon:"❌",label:"Pas fait",score:-2,coach:"notdone"},
 refusal:{icon:"😤",label:"Refus / obstination",score:-3,coach:"refusal"}
};

const COACH={
 argue:{title:"😤 Il s'obstine",steps:["Reste bref et calme : évite le débat qui s'allonge.","Redonne une seule consigne claire : ce que tu veux qu'il fasse maintenant.","Donne un seul avertissement avec une conséquence réaliste que tu peux appliquer.","S'il refuse encore, applique la conséquence annoncée sans repartir la discussion.","Quand c'est fini et qu'il est calme, souligne le prochain bon choix dès qu'il arrive."]},
 repeat:{title:"⚠️ Il faut répéter souvent",steps:["Approche-toi et assure-toi d'avoir son attention avant de parler.","Donne une seule consigne à la fois, précise et adaptée à son âge.","Laisse un court moment pour commencer au lieu de répéter immédiatement.","Au besoin, répète une seule fois avec l'avertissement de la conséquence.","S'il le fait, félicite précisément : « Merci, tu l'as fait quand je te l'ai demandé. »"]},
 refusal:{title:"❌ Il refuse une consigne",steps:["Vérifie qu'il a bien entendu et compris la consigne.","Évite de transformer la consigne en longue négociation.","Annonce calmement la conséquence liée au refus.","Applique-la tout de suite si le refus continue.","Repars à zéro après la conséquence; le but est d'enseigner le prochain bon comportement."]},
 notdone:{title:"📋 La consigne n'a pas été faite",steps:["Distingue oubli et refus avant de réagir.","Redonne clairement ce qui reste à faire et quand ça doit être fait.","S'il s'agit d'un oubli, aide à créer un repère ou une routine.","S'il a choisi de ne pas le faire après avertissement, applique la conséquence prévue."]},
 disrespect:{title:"🗯️ Il parle mal / manque de respect",steps:["Interromps calmement la façon de parler, sans répondre sur le même ton.","Dis exactement ce que tu attends : « Recommence ta phrase calmement. »","S'il se reprend, reconnais-le tout de suite.","Si le comportement continue, applique une conséquence courte et prévisible."]},
 aggression:{title:"💥 Il frappe / devient agressif",steps:["Sécurise d'abord les personnes : sépare les enfants si nécessaire.","Utilise peu de mots : « Je ne te laisse pas frapper. »","Attends le retour au calme avant de discuter ou demander des explications.","Après coup, travaille une alternative concrète : s'éloigner, demander de l'aide, utiliser des mots.","Si l'agressivité est fréquente, intense ou dangereuse, demande conseil à un professionnel qui connaît l'enfant."]},
 tantrum:{title:"😭 Crise / grosse colère",steps:["Assure d'abord la sécurité.","Réduis les paroles pendant le pic de la crise.","Évite d'accorder ce qui avait été refusé uniquement pour arrêter la crise.","Quand il est calmé, reconnecte puis rappelle brièvement la limite.","Valorise le retour au calme et les mots utilisés pour exprimer ce qu'il voulait."]},
 screens:{title:"📱 Conflit autour des écrans",steps:["Annonce la fin à l'avance quand c'est possible.","Utilise une règle prévisible plutôt qu'une négociation différente chaque fois.","Propose immédiatement l'étape suivante : douche, repas, jeu, rangement, etc.","Si la règle est refusée, applique la conséquence annoncée sans ajouter plusieurs nouvelles menaces."]},
 praise:{title:"🌟 Renforcer ce bon comportement",steps:["Dis précisément ce que tu as aimé, pas seulement « bravo ».","Fais-le rapidement après le comportement.","Exemple : « J'ai vu que tu as rangé sans que je te le demande, merci. »"]},
 general:{title:"🧭 Mauvais comportement",steps:["Nommer le comportement précis que tu veux arrêter.","Dire clairement ce que tu veux voir à la place.","Donner un avertissement seulement si tu es prêt à appliquer la conséquence.","Renforcer rapidement le prochain bon comportement."]}
};

const CONTEXTS=["","Fatigue","Écran","Devoirs","Frère / sœur","Heure du coucher","Repas","Transition / départ","Autre"];

function normalize(x){
 if(!x||typeof x!=="object")x=clone(base);
 x.settings=x.settings||{app:"mission-maison"};x.settings.behaviorMode=true;
 if(typeof x.settings.lockReports!=="boolean")x.settings.lockReports=true;
 if(!Array.isArray(x.children)||!x.children.length)x.children=clone(base.children);
 x.children=x.children.map((c,i)=>({
  ...c,
  goalKey:c.goalKey||"none",
  weeklyReward:c.weeklyReward||"",
  rewardMinScore:Number.isFinite(Number(c.rewardMinScore))?Number(c.rewardMinScore):5,
  timerPresets:Array.isArray(c.timerPresets)&&c.timerPresets.length?c.timerPresets.map(Number).filter(n=>n>0).slice(0,6):[5,10,15,20]
 }));
 if(!Array.isArray(x.behaviorEvents))x.behaviorEvents=[];
 if(!Array.isArray(x.instructions))x.instructions=[];
 if(!Array.isArray(x.punishments))x.punishments=[];
 if(!Array.isArray(x.dayClosures))x.dayClosures=[];
 if(!x.parentPin)x.parentPin="1234";
 return x;
}
function migrate(x){
 if(x?.schemaVersion===2)return normalize(x);
 let n=clone(base);if(Array.isArray(x?.children)&&x.children.length)n.children=x.children;return normalize(n);
}
function load(){
 try{let x=localStorage.getItem(STORE);if(x)return normalize(migrate(JSON.parse(x)));x=localStorage.getItem(OLD);if(x)return normalize(migrate(JSON.parse(x)))}catch{}
 return clone(base);
}
function loadProf(){
 try{return JSON.parse(localStorage.getItem(PROF))||{apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0}}
 catch{return{apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0}}
}

let data=load(),profile=loadProf(),view="today",active=localStorage.getItem(ACTIVE)||data.children[0].id;
let historyDate=day(),weekAnchor=day(),monthAnchor=monthKey(),busy=false,dirty=false,syncTimer=null,installPrompt=null,audioCtx=null,alarmHandled={};
let undoStack=[],parentUnlocked=sessionStorage.getItem("missionParentUnlocked")==="1",speech=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function toast(s){const e=document.querySelector("#toast");if(!e)return;e.textContent=s;e.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hidden"),2800)}
function rememberUndo(){undoStack.push(JSON.stringify(data));if(undoStack.length>10)undoStack.shift();renderUndoState()}
function undoLast(){if(!undoStack.length)return toast("Rien à annuler");data=normalize(JSON.parse(undoStack.pop()));dirty=true;save();toast("Dernière action annulée ↩️")}
function renderUndoState(){const b=document.querySelector("#undoBtn");if(b)b.disabled=!undoStack.length}
function save(localOnly=false,rerender=true){data.updatedAt=now();localStorage.setItem(STORE,JSON.stringify(data));if(rerender)render();if(!localOnly&&profile.token){dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,350)}}
function saveProf(){localStorage.setItem(PROF,JSON.stringify(profile))}
function child(id){return data.children.find(c=>c.id===id)}
function choose(id){active=id;localStorage.setItem(ACTIVE,id);render()}
function eventsFor(cid,dateStr){return data.behaviorEvents.filter(e=>e.childId===cid&&e.date===dateStr).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function instructionsFor(cid,dateStr){return data.instructions.filter(i=>i.childId===cid&&i.date===dateStr).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function scoreFor(cid,dateStr){return eventsFor(cid,dateStr).reduce((n,e)=>n+Number(e.score||0),0)}
function activePunishment(cid){return data.punishments.find(p=>p.childId===cid&&p.status==="active")}
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"})}catch{return""}}
function go(v){view=v;render()}
function goProtected(v){if(!data.settings.lockReports||parentUnlocked){view=v;render();return}const pin=prompt("PIN parent :");if(pin===null)return;if(String(pin)===String(data.parentPin)){parentUnlocked=true;sessionStorage.setItem("missionParentUnlocked","1");view=v;render()}else toast("PIN incorrect")}
function lockNow(){parentUnlocked=false;sessionStorage.removeItem("missionParentUnlocked");view="today";render();toast("Rapports verrouillés 🔒")}

function tabs(){
 return '<div class="tabs">'+
  '<button class="tab '+(view==="today"?"on":"")+'" onclick="go(\'today\')">🏠 Aujourd’hui</button>'+
  '<button class="tab '+(view==="history"?"on":"")+'" onclick="goProtected(\'history\')">📅 Historique</button>'+
  '<button class="tab '+(view==="week"?"on":"")+'" onclick="goProtected(\'week\')">📊 Semaine</button>'+
  '<button class="tab '+(view==="month"?"on":"")+'" onclick="goProtected(\'month\')">🗓️ Mois</button>'+
  '<button class="tab '+(view==="family"?"on":"")+'" onclick="goProtected(\'family\')">⚙️ Réglages</button>'+
 '</div>';
}

function childCards(){
 return '<div class="grid">'+data.children.map(c=>{
  const ev=eventsFor(c.id,day()),pos=ev.filter(x=>x.score>0).length,neg=ev.filter(x=>x.score<0).length,p=activePunishment(c.id);
  return '<button class="card child '+(c.id===active?"on":"")+'" onclick="choose(\''+c.id+'\')">'+
   (p?'<span class="timerBadge">⏱️ actif</span>':'')+
   '<div class="avatar">'+c.avatar+'</div><div class="name">'+esc(c.name)+'</div>'+
   '<div class="summary"><span class="scorePos">+'+pos+' positif</span> · <span class="scoreNeg">'+neg+' négatif</span></div>'+
  '</button>';
 }).join("")+'</div>';
}

function selectedContext(){const e=document.querySelector("#contextSelect");return e?.value||""}
function addBehavior(cid,type){
 const b=BEHAVIORS[type];if(!b)return;rememberUndo();
 const context=b.score<0?selectedContext():"";
 data.behaviorEvents.push({id:uid("ev"),childId:cid,date:day(),type,label:b.label,icon:b.icon,score:b.score,createdAt:now(),source:"quick",context,coach:b.coach});
 save();toast(b.icon+" "+b.label+(context?" · "+context:""));
}
function contextSelector(){return '<div class="form"><select id="contextSelect"><option value="">Contexte négatif (optionnel)</option>'+CONTEXTS.filter(Boolean).map(x=>'<option>'+esc(x)+'</option>').join("")+'</select></div>'}
function quickButtons(){
 return contextSelector()+'<div class="quick">'+Object.entries(BEHAVIORS).map(([k,b])=>
  '<button class="btn '+(b.score>0?"success":b.score<-1?"danger":"secondary")+'" onclick="addBehavior(\''+active+'\',\''+k+'\')">'+b.icon+' '+esc(b.label)+'</button>'
 ).join("")+'</div>';
}

function addInstruction(){
 const input=document.querySelector("#instructionText"),title=(input?.value||"").trim();if(!title)return toast("Écris la consigne");rememberUndo();
 data.instructions.push({id:uid("ins"),childId:active,date:day(),title,status:"pending",createdAt:now()});save();toast("Consigne ajoutée");
}
function completeInstruction(id,outcome){
 const i=data.instructions.find(x=>x.id===id),o=OUTCOMES[outcome];if(!i||!o)return;rememberUndo();
 i.status=outcome;i.completedAt=now();data.behaviorEvents=data.behaviorEvents.filter(e=>e.refId!==id);
 data.behaviorEvents.push({id:uid("ev"),childId:i.childId,date:i.date,type:"instruction_"+outcome,label:i.title+" — "+o.label,icon:o.icon,score:o.score,createdAt:now(),source:"instruction",refId:id,coach:o.coach});save();
}
function instructionRow(i){
 const o=OUTCOMES[i.status];
 return '<div class="instruction"><div class="emoji">'+(o?.icon||"📋")+'</div><div class="grow"><div class="title">'+esc(i.title)+'</div>'+
  (i.status==="pending"
   ?'<span class="status pending">En attente</span><div class="actions">'+
    '<button class="btn success" onclick="completeInstruction(\''+i.id+'\',\'first\')">✅ Sans rappel</button>'+
    '<button class="btn secondary" onclick="completeInstruction(\''+i.id+'\',\'one\')">🙂 1 rappel</button>'+
    '<button class="btn orange" onclick="completeInstruction(\''+i.id+'\',\'many\')">⚠️ Plusieurs</button>'+
    '<button class="btn danger" onclick="completeInstruction(\''+i.id+'\',\'notdone\')">❌ Pas fait</button>'+
    '<button class="btn danger" onclick="completeInstruction(\''+i.id+'\',\'refusal\')">😤 Refus</button></div>'

function ensureAudio(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
 }catch{}
}
function playTone(freq=880,duration=420,delay=0){
 ensureAudio();
 try{
  const t=setTimeout(()=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.connect(g);g.connect(audioCtx.destination);
   o.type="sine";o.frequency.value=freq;g.gain.value=.18;
   o.start();
   g.gain.setValueAtTime(.18,audioCtx.currentTime);
   g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration/1000);
   o.stop(audioCtx.currentTime+duration/1000);
  },delay);
  alarmTimers.push(t);
 }catch{}
}
function stopAlarmSound(){
 alarmTimers.forEach(clearTimeout);alarmTimers=[];
}
function beepSequence(){
 stopAlarmSound();
 [0,650,1300,1950].forEach((d,i)=>playTone(i%2?980:780,500,d));
 try{navigator.vibrate?.([350,180,350,180,700])}catch{}
}
async function requestWakeLock(){
 try{
  if(!("wakeLock" in navigator))return false;
  if(wakeLock)return true;
  wakeLock=await navigator.wakeLock.request("screen");
  wakeLock.addEventListener("release",()=>{wakeLock=null});
  return true;
 }catch{
  wakeLock=null;
  return false;
 }
}
async function releaseWakeLock(){
 try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch{wakeLock=null}
}
function hasAnyActiveTimer(){return data.punishments.some(p=>p.status==="active")}
async function syncWakeLock(){
 if(hasAnyActiveTimer() && document.visibilityState==="visible"){
  await requestWakeLock();
 }else if(!hasAnyActiveTimer()){
  await releaseWakeLock();
 }
}
function alarm(p){
 if(alarmHandled[p.id])return;
 alarmHandled[p.id]=true;
 beepSequence();
 const c=child(p.childId);
 toast("⏰ Punition terminée — "+(c?.name||"Enfant"));
 setTimeout(()=>stopAlarmSound(),3200);
}

 const old=activePunishment(active);
 if(old&&!confirm("Un chrono est déjà actif pour "+c.name+". Le remplacer?"))return;
 if(old){old.status="stopped";old.stoppedAt=now()}
 const p={id:uid("pun"),childId:active,date:day(),reason,minutes:mins,startedAt:now(),endAt:new Date(Date.now()+mins*60000).toISOString(),status:"active"};
 data.punishments.push(p);
 data.behaviorEvents.push({id:uid("ev"),childId:active,date:day(),type:"punishment",label:"Punition "+mins+" min — "+reason,icon:"⏱️",score:-2,createdAt:now(),source:"punishment",refId:p.id});
 requestWakeLock();

function remaining(p){return Math.max(0,new Date(p.endAt).getTime()-Date.now())}
function clock(ms){const s=Math.ceil(ms/1000),m=Math.floor(s/60);return pad(m)+":"+pad(s%60)}

function tickTimers(){
 let changed=false;
 data.punishments.filter(p=>p.status==="active").forEach(p=>{
  const ms=remaining(p),el=document.querySelector('[data-timer="'+p.id+'"]');if(el)el.textContent=clock(ms);
  if(ms<=0){
   p.status="ended";p.endedAt=now();changed=true;
   if(Date.now()-new Date(p.endAt).getTime()<120000)alarm(p);
  }
 });
 if(changed){save();syncWakeLock()}
}

function goalProgress(cid,start,end){
 const c=child(cid),ev=data.behaviorEvents.filter(e=>e.childId===cid&&e.date>=start&&e.date<=end),k=c?.goalKey||"none";
 if(k==="first")return {good:ev.filter(e=>e.type==="instruction_first"||e.type==="first").length,bad:ev.filter(e=>["instruction_many","instruction_notdone","instruction_refusal","repeat"].includes(e.type)).length};
 if(k==="lessArgue")return {good:ev.filter(e=>e.score>0).length,bad:ev.filter(e=>e.type==="argue"||e.type==="instruction_refusal").length};
 if(k==="spontaneous")return {good:ev.filter(e=>e.type==="spontaneous").length,bad:0};
 if(k==="respect")return {good:ev.filter(e=>e.score>0).length,bad:ev.filter(e=>e.type==="disrespect").length};
 if(k==="lessRepeat")return {good:ev.filter(e=>e.type==="instruction_first"||e.type==="first").length,bad:ev.filter(e=>e.type==="repeat"||e.type==="instruction_many").length};
 return {good:0,bad:0};
}

function editGoal(id){const c=child(id);if(!c)return;const keys=Object.keys(GOALS),txt=keys.map((k,i)=>(i+1)+" = "+GOALS[k].label).join("\n");const v=prompt("Objectif de "+c.name+" :\n\n"+txt,String(Math.max(1,keys.indexOf(c.goalKey)+1)));if(v===null)return;const k=keys[Number(v)-1];if(!k)return toast("Choix invalide");rememberUndo();c.goalKey=k;save()}
function editReward(id){const c=child(id);if(!c)return;const r=prompt("Récompense hebdomadaire (vide = aucune) :",c.weeklyReward||"");if(r===null)return;const s=prompt("Score minimum pour la débloquer :",String(c.rewardMinScore||5));if(s===null)return;rememberUndo();c.weeklyReward=r.trim();c.rewardMinScore=Number(s)||5;save()}
function editTimers(id){const c=child(id);if(!c)return;const v=prompt("Minutes des boutons de punition, séparées par des virgules :",(c.timerPresets||[5,10,15,20]).join(","));if(v===null)return;const a=v.split(",").map(x=>Number(x.trim())).filter(n=>n>0&&n<=120).slice(0,6);if(!a.length)return toast("Entre au moins une durée");rememberUndo();c.timerPresets=a;save()}
function changePin(){const old=prompt("PIN actuel :");if(old===null)return;if(String(old)!==String(data.parentPin))return toast("PIN incorrect");const n=prompt("Nouveau PIN (4 chiffres recommandé) :");if(n===null||!n.trim())return;rememberUndo();data.parentPin=n.trim();save();toast("PIN changé 🔐")}
function toggleLock(){rememberUndo();data.settings.lockReports=!data.settings.lockReports;if(!data.settings.lockReports){parentUnlocked=true;sessionStorage.setItem("missionParentUnlocked","1")}save();toast(data.settings.lockReports?"Protection activée":"Protection désactivée")}

function familyView(){
 const kids='<div class="card"><h2>👧👦 Réglages par enfant</h2>'+data.children.map(c=>'<div class="settingRow"><div class="emoji">'+c.avatar+'</div><div class="grow"><div class="title">'+esc(c.name)+'</div><div class="small">Objectif : '+esc((GOALS[c.goalKey]||GOALS.none).label)+'<br>Récompense : '+esc(c.weeklyReward||"Aucune")+'<br>Timers : '+(c.timerPresets||[]).join(' / ')+' min</div><div class="actions"><button class="btn secondary" onclick="editChildBasic(\''+c.id+'\')">Nom/emoji</button><button class="btn purple" onclick="editGoal(\''+c.id+'\')">🎯 Objectif</button><button class="btn primary" onclick="editReward(\''+c.id+'\')">🏆 Récompense</button><button class="btn orange" onclick="editTimers(\''+c.id+'\')">⏱️ Timers</button></div></div></div>').join("")+'</div>';
 const privacy='<div class="card"><h2>🔐 Protection parent</h2><div class="notice">Les rapports, l’historique et les réglages peuvent demander le PIN parent. Par défaut : 1234 si tu ne l’as jamais changé.</div><button class="btn big secondary" onclick="changePin()">Changer le PIN</button><button class="btn big secondary" onclick="toggleLock()">'+(data.settings.lockReports?'Désactiver':'Activer')+' la protection des rapports</button><button class="btn big danger" onclick="lockNow()">🔒 Verrouiller maintenant</button></div>';
 if(profile.token)return kids+privacy+'<div class="card"><h2>☁️ Famille synchronisée</h2><div class="notice">Les comportements, consignes, punitions, objectifs et bilans sont partagés entre vos appareils.</div><div class="code">'+esc(profile.joinCode)+'</div><div class="small" style="text-align:center">Code famille</div><p><b>Appareil :</b> '+esc(profile.memberName)+'</p><button class="btn big secondary" onclick="pullCloud(true)">🔄 Synchroniser</button><button class="btn big danger" onclick="leaveFamily()">Déconnecter cet appareil</button></div>';
 return kids+privacy+'<div class="card cloud"><h2>☁️ Créer le partage</h2><input id="memberName" placeholder="Ton nom, ex. Francis"><button class="btn big primary" onclick="createFamily()">🏠 Créer ma famille</button></div><div class="card cloud"><h2>🔗 Rejoindre une famille</h2><input id="joinName" placeholder="Ex. Maman"><input id="joinCode" placeholder="CODE FAMILLE"><button class="btn big success" onclick="joinFamily()">Rejoindre</button><button class="btn big secondary" onclick="testServer()">🧪 Tester le serveur</button></div>';
}

function apiBase(){return API_DEFAULT}
async function parseResponse(r){let j={};try{j=await r.json()}catch{}if(!r.ok){const e=new Error(j.error||("Erreur "+r.status));e.status=r.status;e.data=j;throw e}return j}
async function api(path,opt={}){const headers={Accept:"application/json",...(opt.headers||{})};if(opt.body)headers["Content-Type"]=profile.token?"application/json":"text/plain;charset=UTF-8";if(profile.token)headers.Authorization="Bearer "+profile.token;const r=await fetch(apiBase()+path,{method:opt.method||"GET",body:opt.body,headers,mode:"cors",cache:"no-store",redirect:"follow"});return parseResponse(r)}
async function testServer(){try{const j=await api("/api/health");toast(j.ok?"Serveur OK ✅":"Serveur répond")}catch(e){toast("Serveur : "+e.message)}}
async function createFamily(){profile.memberName=document.querySelector("#memberName").value.trim()||"Parent";try{const j=await api("/api/family/create",{method:"POST",body:JSON.stringify({familyName:"Mission Maison",memberName:profile.memberName,timezone:"America/Toronto"})});Object.assign(profile,{token:j.token,memberId:j.memberId,familyId:j.familyId,joinCode:j.joinCode,cloudVersion:j.version||0});saveProf();dirty=true;await pushCloud();render();toast("Famille créée ✅")}catch(e){toast("Impossible : "+e.message)}}
async function joinFamily(){profile.memberName=document.querySelector("#joinName").value.trim()||"Appareil";const code=document.querySelector("#joinCode").value.trim().toUpperCase();if(!code)return toast("Entre le code famille");try{const j=await api("/api/family/join",{method:"POST",body:JSON.stringify({joinCode:code,memberName:profile.memberName})});Object.assign(profile,{token:j.token,memberId:j.memberId,familyId:j.familyId,joinCode:j.joinCode,cloudVersion:0});saveProf();dirty=false;await pullCloud(true);view="today";render();toast("Famille rejointe ✅")}catch(e){toast("Impossible : "+e.message)}}
async function pushCloud(){if(!profile.token||busy)return;busy=true;try{const j=await api("/api/state",{method:"PUT",body:JSON.stringify({version:Number(profile.cloudVersion||0),data})});profile.cloudVersion=Number(j.version||0);saveProf();dirty=false}catch(e){if(e.status===409&&e.data?.data){data=normalize(e.data.data);profile.cloudVersion=Number(e.data.version||0);saveProf();dirty=false;localStorage.setItem(STORE,JSON.stringify(data));render();toast("Une autre modification est arrivée — réessaie")}else toast("Sync à vérifier")}finally{busy=false}}
async function pullCloud(force=false){if(!profile.token||busy||(dirty&&!force))return;busy=true;try{const j=await api("/api/state");if(j.data?.schemaVersion===2){data=normalize(j.data);profile.cloudVersion=Number(j.version||0);saveProf();localStorage.setItem(STORE,JSON.stringify(data));render()}}catch(e){if(force)toast("Sync impossible : "+e.message)}finally{busy=false}}
function leaveFamily(){if(confirm("Déconnecter cet appareil?")){profile={apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0};saveProf();render()}}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;render()});
window.addEventListener("appinstalled",()=>{installPrompt=null;toast("Mission Maison installée ✅");render()});
async function installApp(){if(!installPrompt)return toast("Menu du navigateur → Ajouter à l’écran d’accueil");installPrompt.prompt();try{await installPrompt.userChoice}catch{}installPrompt=null;render()}
function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true}

function render(){
 if(!child(active))active=data.children[0]?.id;
 const body=view==="today"?todayView():view==="history"?historyView():view==="week"?weekView():view==="month"?monthView():familyView();
 document.querySelector("#app").innerHTML='<div class="wrap"><div class="top"><div><div class="brand">🏠⚡ MISSION MAISON</div><div class="sub">Comportements, consignes et aide parent — simple et rapide</div><div class="sync">'+(profile.token?"☁️ "+esc(profile.memberName)+" · "+esc(profile.joinCode):"☁️ Partage à activer")+'</div></div>'+tabs()+'</div>'+(!isStandalone()?'<div class="installBox"><button class="btn big primary" onclick="installApp()">📲 Installer Mission Maison</button></div>':'')+body+'<div class="footer">Mission Maison · '+(profile.token?"synchronisée ✅":"locale")+' · v3.2 COACH PARENT</div></div><button id="undoBtn" class="undo" onclick="undoLast()" '+(!undoStack.length?'disabled':'')+'>↩️ Annuler</button>';
 tickTimers();renderUndoState();
}

localStorage.setItem(STORE,JSON.stringify(data));saveProf();render();
syncWakeLock();
setInterval(tickTimers,1000);
if(profile.token)pullCloud(true);
setInterval(()=>{if(profile.token&&document.visibilityState==="visible")pullCloud()},7000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){tickTimers();syncWakeLock();if(profile.token)pullCloud(true)}else if(!hasAnyActiveTimer()){releaseWakeLock()}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
