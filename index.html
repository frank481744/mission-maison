<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mission Maison</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission Maison">
<style>
:root{--card:#111827;--line:#334155;--text:#f8fafc;--muted:#cbd5e1;--yellow:#fbbf24;--green:#22c55e;--red:#ef4444;--blue:#38bdf8;--orange:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#0f172a,#0b1220);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}.wrap{max-width:980px;margin:auto;padding:16px 14px 42px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:27px;font-weight:950}.sub,.small{color:var(--muted);font-size:13px}.sync{font-size:12px;color:#bae6fd;margin-top:3px}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#172033;color:white;border-radius:999px;padding:10px 13px;font-weight:900}.tab.on{background:var(--yellow);color:#111827}
.card{background:rgba(17,24,39,.96);border:1px solid var(--line);border-radius:20px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.child{width:100%;text-align:left;color:white;position:relative}.child.on{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow) inset}.avatar{font-size:40px}.name{font-size:19px;font-weight:950}.summary{font-size:12px;color:#cbd5e1;margin-top:4px}
.scorePos{color:#86efac;font-weight:900}.scoreNeg{color:#fca5a5;font-weight:900}.timerBadge{position:absolute;right:10px;top:10px;background:#7f1d1d;color:#fecaca;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:950}
.event,.instruction,.timerBox{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#121a2a;border-radius:16px;padding:12px;margin:9px 0}.emoji{font-size:27px}.grow{flex:1;min-width:0}.title{font-size:16px;font-weight:950}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:12px;padding:9px 11px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.big{width:100%;padding:13px;margin-top:9px}
.primary{background:var(--yellow);color:#111827}.success{background:var(--green);color:#052e16}.danger{background:var(--red);color:white}.secondary{background:#263244;color:white;border:1px solid #475569}.orange{background:var(--orange);color:#431407}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.form input,.form select,.cloud input{width:100%;background:#0b1322;color:white;border:1px solid var(--line);border-radius:11px;padding:10px}.cloud input{margin:5px 0}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick .btn{min-height:52px;text-align:left}
.notice{border:1px dashed #475569;background:#0b1322;border-radius:14px;padding:11px;color:#cbd5e1}.pill{background:#263244;border-radius:99px;padding:5px 8px;font-size:12px;font-weight:900}.stat{display:flex;justify-content:space-between;gap:8px;align-items:center}.code{text-align:center;color:var(--yellow);font-size:30px;font-weight:950;letter-spacing:4px;padding:10px}
.verdict{font-size:20px;font-weight:950;padding:12px;border-radius:14px;background:#0b1322;border:1px solid #334155;margin:10px 0}
.status{display:inline-block;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900;margin-top:6px}.pending{background:#0c4a6e;color:#bae6fd}.done{background:#14532d;color:#bbf7d0}.bad{background:#7f1d1d;color:#fecaca}.neutral{background:#334155;color:#e2e8f0}
.timerClock{font-size:31px;font-weight:950;color:#fca5a5;letter-spacing:1px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
h2,h3{margin:5px 0 11px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#020617;border:1px solid #475569;border-radius:13px;padding:11px 15px;font-weight:850;z-index:9999;max-width:90vw;text-align:center}.hidden{display:none}.installBox{margin:12px 0}.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:20px}
@media(max-width:600px){.brand{font-size:23px}.quick{grid-template-columns:1fr}.stat{align-items:flex-start}.timerClock{font-size:27px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const STORE="missionMaisonV2",OLD="mission-maison-v1",PROF="missionMaisonCloudV1",ACTIVE="missionMaisonActive";
const API_DEFAULT="https://budget-pack-api.2ywtpfbvpb.workers.dev";
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,"0");
const day=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromDay=s=>new Date(s+"T12:00:00");
const addDays=(s,n)=>{const d=fromDay(s);d.setDate(d.getDate()+n);return day(d)};

const base={
 schemaVersion:2,settings:{app:"mission-maison",behaviorMode:true},parentPin:"1234",
 children:[
  {id:"c1",name:"Dylan",avatar:"🦸",points:0},{id:"c2",name:"Nolan",avatar:"🦖",points:0},
  {id:"c3",name:"Enfant 3",avatar:"🦄",points:0},{id:"c4",name:"Enfant 4",avatar:"🐼",points:0},
  {id:"c5",name:"Enfant 5",avatar:"🐯",points:0},{id:"c6",name:"Enfant 6",avatar:"🦊",points:0}
 ],
 behaviorEvents:[],instructions:[],punishments:[],updatedAt:now()
};

const BEHAVIORS={
 spontaneous:{icon:"🌟",label:"A aidé sans qu'on demande",score:3},
 kind:{icon:"❤️",label:"Beau geste",score:2},
 first:{icon:"✅",label:"A écouté / fait du premier coup",score:2},
 help:{icon:"🤝",label:"A aidé après demande",score:1},
 repeat:{icon:"⚠️",label:"A fallu répéter",score:-1},
 argue:{icon:"😤",label:"S'est obstiné",score:-2},
 disrespect:{icon:"🗯️",label:"Manque de respect",score:-3},
 bad:{icon:"👎",label:"Mauvais comportement",score:-2}
};

const OUTCOMES={
 first:{icon:"✅",label:"Fait sans rappel",score:2},
 one:{icon:"🙂",label:"Fait après 1 rappel",score:1},
 many:{icon:"⚠️",label:"Fait après plusieurs rappels",score:-1},
 notdone:{icon:"❌",label:"Pas fait",score:-2},
 refusal:{icon:"😤",label:"Refus / obstination",score:-3}
};

function normalize(x){
 if(!x||typeof x!=="object")x=clone(base);
 x.settings=x.settings||{app:"mission-maison"};x.settings.behaviorMode=true;
 if(!Array.isArray(x.children)||!x.children.length)x.children=clone(base.children);
 if(!Array.isArray(x.behaviorEvents))x.behaviorEvents=[];
 if(!Array.isArray(x.instructions))x.instructions=[];
 if(!Array.isArray(x.punishments))x.punishments=[];
 return x;
}
function migrate(x){
 if(x?.schemaVersion===2)return normalize(x);
 let n=clone(base);
 if(Array.isArray(x?.children)&&x.children.length)n.children=x.children;
 return normalize(n);
}
function load(){
 try{
  let x=localStorage.getItem(STORE);if(x)return normalize(migrate(JSON.parse(x)));
  x=localStorage.getItem(OLD);if(x)return normalize(migrate(JSON.parse(x)));
 }catch{}
 return clone(base);
}
function loadProf(){
 try{return JSON.parse(localStorage.getItem(PROF))||{apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0}}
 catch{return{apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0}}
}

let data=load(),profile=loadProf(),view="today",active=localStorage.getItem(ACTIVE)||data.children[0].id;
let historyDate=day(),weekAnchor=day(),busy=false,dirty=false,syncTimer=null,installPrompt=null,audioCtx=null,alarmHandled={};

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function toast(s){const e=document.querySelector("#toast");if(!e)return;e.textContent=s;e.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hidden"),2600)}
function save(localOnly=false){data.updatedAt=now();localStorage.setItem(STORE,JSON.stringify(data));render();if(!localOnly&&profile.token){dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,350)}}
function saveProf(){localStorage.setItem(PROF,JSON.stringify(profile))}
function child(id){return data.children.find(c=>c.id===id)}
function choose(id){active=id;localStorage.setItem(ACTIVE,id);render()}
function eventsFor(cid,dateStr){return data.behaviorEvents.filter(e=>e.childId===cid&&e.date===dateStr).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function instructionsFor(cid,dateStr){return data.instructions.filter(i=>i.childId===cid&&i.date===dateStr).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function scoreFor(cid,dateStr){return eventsFor(cid,dateStr).reduce((n,e)=>n+Number(e.score||0),0)}
function activePunishment(cid){return data.punishments.find(p=>p.childId===cid&&p.status==="active")}
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"})}catch{return""}}

function tabs(){
 return '<div class="tabs">'+
  '<button class="tab '+(view==="today"?"on":"")+'" onclick="view=\'today\';render()">🏠 Aujourd’hui</button>'+
  '<button class="tab '+(view==="history"?"on":"")+'" onclick="view=\'history\';render()">📅 Historique</button>'+
  '<button class="tab '+(view==="week"?"on":"")+'" onclick="view=\'week\';render()">📊 Semaine</button>'+
  '<button class="tab '+(view==="family"?"on":"")+'" onclick="view=\'family\';render()">☁️ Famille</button>'+
 '</div>';
}

function childCards(){
 return '<div class="grid">'+data.children.map(c=>{
  const ev=eventsFor(c.id,day()),pos=ev.filter(x=>x.score>0).length,neg=ev.filter(x=>x.score<0).length,p=activePunishment(c.id);
  return '<button class="card child '+(c.id===active?"on":"")+'" onclick="choose(\''+c.id+'\')">'+
   (p?'<span class="timerBadge">⏱️ actif</span>':'')+
   '<div class="avatar">'+c.avatar+'</div><div class="name">'+esc(c.name)+'</div>'+
   '<div class="summary"><span class="scorePos">+'+pos+' positif</span> · <span class="scoreNeg">'+neg+' négatif</span></div>'+
  '</button>';
 }).join("")+'</div>';
}

function addBehavior(cid,type){
 const b=BEHAVIORS[type];if(!b)return;
 data.behaviorEvents.push({id:uid("ev"),childId:cid,date:day(),type,label:b.label,icon:b.icon,score:b.score,createdAt:now(),source:"quick"});
 save();toast(b.icon+" "+b.label);
}
function quickButtons(){
 return '<div class="quick">'+Object.entries(BEHAVIORS).map(([k,b])=>
  '<button class="btn '+(b.score>0?"success":b.score<-1?"danger":"secondary")+'" onclick="addBehavior(\''+active+'\',\''+k+'\')">'+b.icon+' '+esc(b.label)+'</button>'
 ).join("")+'</div>';
}

function addInstruction(){
 const input=document.querySelector("#instructionText"),title=(input?.value||"").trim();if(!title)return toast("Écris la consigne");
 data.instructions.push({id:uid("ins"),childId:active,date:day(),title,status:"pending",createdAt:now()});save();toast("Consigne ajoutée");
}
function completeInstruction(id,outcome){
 const i=data.instructions.find(x=>x.id===id),o=OUTCOMES[outcome];if(!i||!o)return;
 i.status=outcome;i.completedAt=now();
 data.behaviorEvents=data.behaviorEvents.filter(e=>e.refId!==id);
 data.behaviorEvents.push({id:uid("ev"),childId:i.childId,date:i.date,type:"instruction_"+outcome,label:i.title+" — "+o.label,icon:o.icon,score:o.score,createdAt:now(),source:"instruction",refId:id});
 save();
}
function instructionRow(i){
 const o=OUTCOMES[i.status];
 return '<div class="instruction"><div class="emoji">'+(o?.icon||"📋")+'</div><div class="grow"><div class="title">'+esc(i.title)+'</div>'+
  (i.status==="pending"
   ?'<span class="status pending">En attente</span><div class="actions">'+
    '<button class="btn success" onclick="completeInstruction(\''+i.id+'\',\'first\')">✅ Sans rappel</button>'+
    '<button class="btn secondary" onclick="completeInstruction(\''+i.id+'\',\'one\')">🙂 1 rappel</button>'+
    '<button class="btn orange" onclick="completeInstruction(\''+i.id+'\',\'many\')">⚠️ Plusieurs</button>'+
    '<button class="btn danger" onclick="completeInstruction(\''+i.id+'\',\'notdone\')">❌ Pas fait</button>'+
    '<button class="btn danger" onclick="completeInstruction(\''+i.id+'\',\'refusal\')">😤 Refus</button></div>'
   :'<span class="status '+(o.score>0?"done":o.score<0?"bad":"neutral")+'">'+esc(o.label)+'</span><div class="actions"><button class="btn secondary" onclick="resetInstruction(\''+i.id+'\')">↩️ Modifier résultat</button></div>')+
 '</div></div>';
}
function resetInstruction(id){
 const i=data.instructions.find(x=>x.id===id);if(!i)return;
 i.status="pending";delete i.completedAt;
 data.behaviorEvents=data.behaviorEvents.filter(e=>e.refId!==id);save();
}

function deleteEvent(id){
 const e=data.behaviorEvents.find(x=>x.id===id);if(!e)return;
 if(e.source==="punishment"&&e.refId)data.punishments=data.punishments.filter(p=>p.id!==e.refId);
 data.behaviorEvents=data.behaviorEvents.filter(x=>x.id!==id);save();
}
function eventRow(e){
 return '<div class="event"><div class="emoji">'+(e.icon||"•")+'</div><div class="grow"><div class="title">'+esc(e.label)+'</div>'+
  '<div class="small">'+fmtTime(e.createdAt)+' · '+(e.score>0?"+":"")+e.score+' au bilan</div></div>'+
  '<button class="btn secondary" onclick="deleteEvent(\''+e.id+'\')">🗑️</button></div>';
}

function ensureAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch{}}
function beep(){
 ensureAudio();
 try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=.12;o.start();setTimeout(()=>o.stop(),500)}catch{}
 try{navigator.vibrate?.([300,150,300,150,500])}catch{}
}
function alarm(p){
 if(alarmHandled[p.id])return;alarmHandled[p.id]=true;beep();setTimeout(beep,700);
 const c=child(p.childId);toast("⏰ Punition terminée — "+(c?.name||"Enfant"));
 try{if(Notification.permission==="granted")new Notification("Mission Maison",{body:"Punition terminée — "+(c?.name||"Enfant")})}catch{}
}
function startPunishment(mins){
 const c=child(active);if(!c)return;ensureAudio();
 const reason=(document.querySelector("#punishReason")?.value||"Punition").trim()||"Punition";
 const old=activePunishment(active);
 if(old&&!confirm("Un chrono est déjà actif pour "+c.name+". Le remplacer?"))return;
 if(old){old.status="stopped";old.stoppedAt=now()}
 const p={id:uid("pun"),childId:active,date:day(),reason,minutes:mins,startedAt:now(),endAt:new Date(Date.now()+mins*60000).toISOString(),status:"active"};
 data.punishments.push(p);
 data.behaviorEvents.push({id:uid("ev"),childId:active,date:day(),type:"punishment",label:"Punition "+mins+" min — "+reason,icon:"⏱️",score:-2,createdAt:now(),source:"punishment",refId:p.id});
 save();toast("⏱️ Chrono "+mins+" min démarré");
}
function stopPunishment(id){const p=data.punishments.find(x=>x.id===id);if(!p||p.status!=="active")return;p.status="stopped";p.stoppedAt=now();save();toast("Chrono arrêté")}
function addPunishTime(id,mins){const p=data.punishments.find(x=>x.id===id);if(!p||p.status!=="active")return;p.endAt=new Date(new Date(p.endAt).getTime()+mins*60000).toISOString();p.minutes+=mins;save()}
function remaining(p){return Math.max(0,new Date(p.endAt).getTime()-Date.now())}
function clock(ms){const s=Math.ceil(ms/1000),m=Math.floor(s/60);return pad(m)+":"+pad(s%60)}
function timerPanel(){
 const p=activePunishment(active);
 if(!p)return '<div class="notice">Aucun chrono actif pour cet enfant.</div>';
 return '<div class="timerBox"><div class="emoji">⏱️</div><div class="grow"><div class="title">'+esc(p.reason)+'</div><div class="timerClock" data-timer="'+p.id+'">'+clock(remaining(p))+'</div>'+
  '<div class="small">Punition de '+p.minutes+' min</div><div class="actions"><button class="btn secondary" onclick="addPunishTime(\''+p.id+'\',5)">+5 min</button><button class="btn danger" onclick="stopPunishment(\''+p.id+'\')">Arrêter</button></div></div></div>';
}
function tickTimers(){
 let changed=false;
 data.punishments.filter(p=>p.status==="active").forEach(p=>{
  const ms=remaining(p),el=document.querySelector('[data-timer="'+p.id+'"]');if(el)el.textContent=clock(ms);
  if(ms<=0){p.status="ended";p.endedAt=now();changed=true;if(Date.now()-new Date(p.endAt).getTime()<120000)alarm(p)}
 });
 if(changed)save();
}
function requestTimerAlerts(){
 ensureAudio();
 if(!("Notification" in window))return toast("Les alertes système ne sont pas disponibles ici");
 if(Notification.permission==="granted")return toast("Alertes déjà activées 🔔");
 Notification.requestPermission().then(x=>toast(x==="granted"?"Alertes activées 🔔":"Alertes non autorisées"));
}

function todayView(){
 const c=child(active)||data.children[0],ins=instructionsFor(c.id,day()),ev=eventsFor(c.id,day());
 return childCards()+
 '<div class="card"><div class="stat"><h2>'+c.avatar+' '+esc(c.name)+'</h2><span class="pill">Bilan du jour '+(scoreFor(c.id,day())>=0?"+":"")+scoreFor(c.id,day())+'</span></div><h3>⚡ Noter vite</h3>'+quickButtons()+'</div>'+
 '<div class="card"><h2>📋 Consigne donnée</h2><div class="notice">Exemple : « Faire sa chambre ». Ensuite, tu notes seulement comment ça s’est passé.</div>'+
 '<div class="form"><input id="instructionText" list="suggestions" placeholder="Ex. Faire sa chambre"><datalist id="suggestions"><option value="Faire sa chambre"><option value="Ranger ses choses"><option value="Mettre la table"><option value="Prendre sa douche"><option value="Faire ses devoirs"></datalist>'+
 '<button class="btn primary" onclick="addInstruction()">Ajouter la consigne</button></div>'+ins.map(instructionRow).join("")+'</div>'+
 '<div class="card"><h2>⏱️ Punition avec chrono</h2><div class="form"><input id="punishReason" placeholder="Raison" value="Refus / obstination"><button class="btn secondary" onclick="requestTimerAlerts()">🔔 Activer alerte</button></div>'+
 '<div class="actions"><button class="btn orange" onclick="startPunishment(5)">5 min</button><button class="btn orange" onclick="startPunishment(10)">10 min</button><button class="btn orange" onclick="startPunishment(15)">15 min</button><button class="btn orange" onclick="startPunishment(20)">20 min</button></div>'+timerPanel()+'</div>'+
 '<div class="card"><h2>📝 Aujourd’hui</h2>'+(ev.length?ev.map(eventRow).join(""):'<div class="notice">🙂 Journée neutre pour l’instant : rien de mal noté, rien de spécial non plus.</div>')+'</div>';
}

function dateControls(){
 return '<div class="row"><button class="btn secondary" onclick="historyDate=addDays(historyDate,-1);render()">← Jour</button><input id="historyDate" type="date" value="'+historyDate+'" onchange="historyDate=this.value;render()"><button class="btn secondary" onclick="historyDate=addDays(historyDate,1);render()">Jour →</button></div>';
}
function historyView(){
 const c=child(active)||data.children[0],ev=eventsFor(c.id,historyDate),ins=instructionsFor(c.id,historyDate);
 return childCards()+'<div class="card"><h2>📅 Historique — '+esc(c.name)+'</h2>'+dateControls()+
 '<div class="verdict">'+(ev.length?'Bilan du jour : '+(scoreFor(c.id,historyDate)>=0?"+":"")+scoreFor(c.id,historyDate):'🙂 Journée neutre — aucun événement particulier noté')+'</div>'+
 '<h3>Consignes</h3>'+(ins.length?ins.map(instructionRow).join(""):'<p class="small">Aucune consigne enregistrée.</p>')+
 '<h3>Événements</h3>'+(ev.length?ev.map(eventRow).join(""):'<p class="small">Aucun événement enregistré.</p>')+'</div>';
}

function mondayOf(s){const d=fromDay(s),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return day(d)}
function weekData(cid,anchor){
 const start=mondayOf(anchor),end=addDays(start,6),ev=data.behaviorEvents.filter(e=>e.childId===cid&&e.date>=start&&e.date<=end);
 const score=ev.reduce((n,e)=>n+Number(e.score||0),0),pos=ev.filter(e=>e.score>0).length,neg=ev.filter(e=>e.score<0).length,pun=ev.filter(e=>e.type==="punishment").length;
 const outcomes={first:0,one:0,many:0,notdone:0,refusal:0};
 ev.forEach(e=>{const k=String(e.type||"").replace("instruction_","");if(k in outcomes)outcomes[k]++});
 let verdict="⚪ Semaine neutre — rien de particulier noté";
 if(ev.length){
  if(score>=12&&neg<=2)verdict="🌟 Excellente semaine";
  else if(score>=5)verdict="🟢 Bonne semaine";
  else if(score>=-4)verdict="⚪ Semaine correcte";
  else if(score>=-10)verdict="🟠 Semaine à travailler";
  else verdict="🔴 Semaine difficile";
 }
 return {start,end,ev,score,pos,neg,pun,outcomes,verdict};
}
function shiftWeek(n){weekAnchor=addDays(mondayOf(weekAnchor),n*7);render()}
function weekView(){
 const start=mondayOf(weekAnchor),end=addDays(start,6);
 return '<div class="card"><div class="row"><button class="btn secondary" onclick="shiftWeek(-1)">← Semaine</button><div><h2>📊 Verdict de la semaine</h2><div class="small">'+start+' au '+end+'</div></div><button class="btn secondary" onclick="shiftWeek(1)">Semaine →</button></div></div>'+
 data.children.map(c=>{const w=weekData(c.id,weekAnchor);return '<div class="card"><div class="stat"><h2>'+c.avatar+' '+esc(c.name)+'</h2><span class="pill">'+(w.score>=0?"+":"")+w.score+'</span></div>'+
  '<div class="verdict">'+w.verdict+'</div>'+
  '<div class="grid"><div class="notice"><b>👍 Positifs</b><br>'+w.pos+'</div><div class="notice"><b>⚠️ Négatifs</b><br>'+w.neg+'</div><div class="notice"><b>⏱️ Punitions</b><br>'+w.pun+'</div><div class="notice"><b>📋 Consignes réussies</b><br>'+(w.outcomes.first+w.outcomes.one)+'</div></div>'+
  '<div class="small" style="margin-top:10px">Sans rappel: '+w.outcomes.first+' · 1 rappel: '+w.outcomes.one+' · plusieurs rappels: '+w.outcomes.many+' · pas fait: '+w.outcomes.notdone+' · refus: '+w.outcomes.refusal+'</div></div>'
 }).join("");
}

function editChild(id){
 const c=child(id);if(!c)return;
 const n=prompt("Nom :",c.name);if(n===null)return;
 const a=prompt("Emoji :",c.avatar);if(a===null)return;
 c.name=n.trim()||c.name;c.avatar=a.trim()||c.avatar;save();
}

function familyView(){
 const kids='<div class="card"><h2>👧👦 Enfants</h2>'+data.children.map(c=>'<div class="event"><div class="emoji">'+c.avatar+'</div><div class="grow"><div class="title">'+esc(c.name)+'</div></div><button class="btn secondary" onclick="editChild(\''+c.id+'\')">Modifier</button></div>').join("")+'</div>';
 if(profile.token)return kids+'<div class="card"><h2>☁️ Famille synchronisée</h2><div class="notice">Les comportements, consignes, punitions et bilans sont partagés entre vos appareils.</div><div class="code">'+esc(profile.joinCode)+'</div><div class="small" style="text-align:center">Code famille</div><p><b>Appareil :</b> '+esc(profile.memberName)+'</p><button class="btn big secondary" onclick="pullCloud(true)">🔄 Synchroniser</button><button class="btn big danger" onclick="leaveFamily()">Déconnecter cet appareil</button></div>';
 return kids+'<div class="card cloud"><h2>☁️ Créer le partage</h2><input id="memberName" placeholder="Ton nom, ex. Francis"><button class="btn big primary" onclick="createFamily()">🏠 Créer ma famille</button></div>'+
 '<div class="card cloud"><h2>🔗 Rejoindre une famille</h2><input id="joinName" placeholder="Ex. Maman"><input id="joinCode" placeholder="CODE FAMILLE"><button class="btn big success" onclick="joinFamily()">Rejoindre</button><button class="btn big secondary" onclick="testServer()">🧪 Tester le serveur</button></div>';
}

function apiBase(){return API_DEFAULT}
async function parseResponse(r){let j={};try{j=await r.json()}catch{}if(!r.ok){const e=new Error(j.error||("Erreur "+r.status));e.status=r.status;e.data=j;throw e}return j}
async function api(path,opt={}){
 const headers={Accept:"application/json",...(opt.headers||{})};
 if(opt.body)headers["Content-Type"]=profile.token?"application/json":"text/plain;charset=UTF-8";
 if(profile.token)headers.Authorization="Bearer "+profile.token;
 const r=await fetch(apiBase()+path,{method:opt.method||"GET",body:opt.body,headers,mode:"cors",cache:"no-store",redirect:"follow"});
 return parseResponse(r);
}
async function testServer(){try{const j=await api("/api/health");toast(j.ok?"Serveur OK ✅":"Serveur répond")}catch(e){toast("Serveur : "+e.message)}}
async function createFamily(){
 profile.memberName=document.querySelector("#memberName").value.trim()||"Parent";
 try{
  const j=await api("/api/family/create",{method:"POST",body:JSON.stringify({familyName:"Mission Maison",memberName:profile.memberName,timezone:"America/Toronto"})});
  Object.assign(profile,{token:j.token,memberId:j.memberId,familyId:j.familyId,joinCode:j.joinCode,cloudVersion:j.version||0});
  saveProf();dirty=true;await pushCloud();render();toast("Famille créée ✅");
 }catch(e){toast("Impossible : "+e.message)}
}
async function joinFamily(){
 profile.memberName=document.querySelector("#joinName").value.trim()||"Appareil";
 const code=document.querySelector("#joinCode").value.trim().toUpperCase();if(!code)return toast("Entre le code famille");
 try{
  const j=await api("/api/family/join",{method:"POST",body:JSON.stringify({joinCode:code,memberName:profile.memberName})});
  Object.assign(profile,{token:j.token,memberId:j.memberId,familyId:j.familyId,joinCode:j.joinCode,cloudVersion:0});
  saveProf();dirty=false;await pullCloud(true);view="today";render();toast("Famille rejointe ✅");
 }catch(e){toast("Impossible : "+e.message)}
}
async function pushCloud(){
 if(!profile.token||busy)return;busy=true;
 try{
  const j=await api("/api/state",{method:"PUT",body:JSON.stringify({version:Number(profile.cloudVersion||0),data})});
  profile.cloudVersion=Number(j.version||0);saveProf();dirty=false;
 }catch(e){
  if(e.status===409&&e.data?.data){data=normalize(e.data.data);profile.cloudVersion=Number(e.data.version||0);saveProf();dirty=false;localStorage.setItem(STORE,JSON.stringify(data));render();toast("Une autre modification est arrivée — réessaie")}
  else toast("Sync à vérifier");
 }finally{busy=false}
}
async function pullCloud(force=false){
 if(!profile.token||busy||(dirty&&!force))return;busy=true;
 try{
  const j=await api("/api/state");
  if(j.data?.schemaVersion===2){data=normalize(j.data);profile.cloudVersion=Number(j.version||0);saveProf();localStorage.setItem(STORE,JSON.stringify(data));render()}
 }catch(e){if(force)toast("Sync impossible : "+e.message)}
 finally{busy=false}
}
function leaveFamily(){
 if(confirm("Déconnecter cet appareil?")){
  profile={apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0};
  saveProf();render();
 }
}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;render()});
window.addEventListener("appinstalled",()=>{installPrompt=null;toast("Mission Maison installée ✅");render()});
async function installApp(){
 if(!installPrompt)return toast("Menu du navigateur → Ajouter à l’écran d’accueil");
 installPrompt.prompt();try{await installPrompt.userChoice}catch{}installPrompt=null;render();
}
function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true}

function render(){
 if(!child(active))active=data.children[0]?.id;
 const body=view==="today"?todayView():view==="history"?historyView():view==="week"?weekView():familyView();
 document.querySelector("#app").innerHTML='<div class="wrap"><div class="top"><div><div class="brand">🏠⚡ MISSION MAISON</div><div class="sub">Suivi simple des comportements — parents seulement</div><div class="sync">'+(profile.token?"☁️ "+esc(profile.memberName)+" · "+esc(profile.joinCode):"☁️ Partage à activer")+'</div></div>'+tabs()+'</div>'+
 (!isStandalone()?'<div class="installBox"><button class="btn big primary" onclick="installApp()">📲 Installer Mission Maison</button></div>':'')+body+
 '<div class="footer">Mission Maison · '+(profile.token?"synchronisée ✅":"locale")+' · v3.0 COMPORTEMENT</div></div>';
 tickTimers();
}

localStorage.setItem(STORE,JSON.stringify(data));saveProf();render();
setInterval(tickTimers,1000);
if(profile.token)pullCloud(true);
setInterval(()=>{if(profile.token&&document.visibilityState==="visible")pullCloud()},7000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){tickTimers();if(profile.token)pullCloud(true)}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
