<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Mission Maison — QG Famille</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission Maison">
<style>
:root{
 --bg:#050b14;--panel:#0c1726;--panel2:#101f31;--line:#233a52;--text:#f7fbff;--muted:#9fb1c5;
 --cyan:#27e1ff;--green:#45f58a;--gold:#ffd451;--red:#ff5f6d;--orange:#ff9e43;--purple:#a987ff;
 --shadow:0 18px 55px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 20% -10%,rgba(39,225,255,.12),transparent 30%),
 radial-gradient(circle at 90% 0%,rgba(169,135,255,.12),transparent 28%),
 linear-gradient(180deg,#07111f 0%,#050b14 65%,#030810 100%);
 color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:auto;padding:14px 13px 100px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.logoMark{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:26px;
 background:linear-gradient(145deg,rgba(39,225,255,.18),rgba(169,135,255,.16));border:1px solid #2d536c;
 box-shadow:0 0 32px rgba(39,225,255,.08)}
.brand{font-size:21px;font-weight:1000;letter-spacing:.2px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.iconBtn{border:1px solid var(--line);background:#0b1725;color:#fff;border-radius:14px;padding:10px 12px;font-weight:900}
.hero{background:linear-gradient(145deg,rgba(14,30,48,.96),rgba(7,18,31,.98));border:1px solid #26445d;border-radius:28px;
 padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% auto auto 50%;width:320px;height:320px;border-radius:50%;
 background:radial-gradient(circle,rgba(39,225,255,.12),transparent 65%);pointer-events:none}
.rewardTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.kicker{font-size:11px;font-weight:1000;letter-spacing:1.2px;color:#9fefff;text-transform:uppercase}
.rewardTitle{font-size:25px;font-weight:1000;line-height:1.08}.rewardHint{font-size:12px;color:var(--muted);margin-top:5px}
.lockPill{border-radius:999px;padding:7px 10px;font-size:11px;font-weight:1000;border:1px solid #3e5064;background:#111d2b;color:#ccd8e5}
.lockPill.open{border-color:#2b7f4a;background:#0e2f1d;color:#aaffc6}
.heroGrid{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:center}
.gauge{--p:0%;width:178px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin:auto;position:relative;
 background:conic-gradient(var(--green) 0 var(--p),rgba(255,255,255,.08) var(--p) 100%);
 filter:drop-shadow(0 0 16px rgba(69,245,138,.12))}
.gauge:before{content:"";position:absolute;inset:13px;border-radius:50%;background:radial-gradient(circle at 45% 35%,#13283d,#091421 70%);border:1px solid #28445c}
.gaugeIn{position:relative;text-align:center;z-index:1}.pct{font-size:40px;font-weight:1000}.pctLabel{font-size:11px;color:#a8bdcf;font-weight:900;letter-spacing:.5px}
.chest{display:flex;gap:14px;align-items:center;background:rgba(5,12,22,.56);border:1px solid #283f55;border-radius:22px;padding:15px}
.chestIcon{font-size:64px;filter:drop-shadow(0 8px 18px rgba(255,212,81,.2));animation:float 2.8s ease-in-out infinite}
.chest.open .chestIcon{animation:pop .55s ease-out,glow 1.3s ease-in-out infinite alternate}
@keyframes float{50%{transform:translateY(-4px)}}@keyframes pop{50%{transform:scale(1.25) rotate(-4deg)}}@keyframes glow{to{filter:drop-shadow(0 0 22px rgba(255,212,81,.75))}}
.progressMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metaBox{background:#091523;border:1px solid #1f3950;border-radius:15px;padding:10px}.metaBig{font-weight:1000;font-size:18px}.metaSmall{font-size:11px;color:var(--muted);margin-top:2px}
.card{background:linear-gradient(145deg,rgba(12,23,38,.98),rgba(8,17,30,.98));border:1px solid var(--line);border-radius:22px;padding:15px;margin-top:12px;box-shadow:0 12px 36px rgba(0,0,0,.18)}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sectionTitle h2{font-size:18px;margin:0}.tiny{font-size:11px;color:var(--muted)}
.kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kid{border:1px solid #27445d;background:#0a1726;border-radius:19px;padding:13px;position:relative;min-height:158px}
.kid.done{border-color:#297349;background:linear-gradient(145deg,#0d2a1d,#0a1820);box-shadow:0 0 0 1px rgba(69,245,138,.08) inset}
.kidHead{display:flex;gap:9px;align-items:center}.avatar{font-size:31px}.kidName{font-size:16px;font-weight:1000}.mission{font-size:15px;font-weight:900;line-height:1.25;margin:12px 0;color:#eaf6ff}
.priv{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:1000;border-radius:999px;padding:6px 8px;background:#311a1d;color:#ffc2c7;border:1px solid #6b3038}
.priv.open{background:#0f321f;color:#aaffc6;border-color:#2b764a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}
.btn{border:0;border-radius:14px;padding:11px 13px;font-weight:1000;color:#fff;background:#1a2a3c}
.btn.good{background:linear-gradient(135deg,#27c86b,#42ef88);color:#052211}.btn.bad{background:#67272e}.btn.gold{background:linear-gradient(135deg,#ffbd31,#ffe06a);color:#2b1a00}
.btn.cyan{background:linear-gradient(135deg,#0fa5c7,#25dcff);color:#031920}.btn.purple{background:linear-gradient(135deg,#6e50dc,#a98aff)}
.btn.big{width:100%;font-size:17px;padding:15px}.btn.small{padding:7px 9px;font-size:11px;border-radius:11px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,980px);padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(4,10,18,.94);backdrop-filter:blur(16px);border-top:1px solid #1d3145;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;z-index:50}
.nav button{border:1px solid #21384e;background:#0b1725;color:#d9e7f3;border-radius:15px;padding:9px 4px;font-size:10px;font-weight:1000}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.on{background:#132b3e;border-color:#3b6b8b;color:#fff}
.rewardEditor{display:none;margin-top:12px}.rewardEditor.on{display:block}
textarea,input,select{width:100%;background:#07131f;color:#fff;border:1px solid #29445b;border-radius:14px;padding:11px;outline:none}
textarea:focus,input:focus,select:focus{border-color:#27c8e8;box-shadow:0 0 0 2px rgba(39,225,255,.08)}
textarea{min-height:82px;resize:vertical}
.codeHelp{font-size:10px;color:#7890a7;margin-top:6px}
.resetHero{text-align:center;padding:18px}.resetClock{font-size:64px;font-weight:1000;letter-spacing:-2px;color:#fff;text-shadow:0 0 25px rgba(39,225,255,.16)}
.resetRing{width:230px;aspect-ratio:1;border-radius:50%;margin:12px auto;display:grid;place-items:center;border:1px solid #28506b;background:radial-gradient(circle,#10243a 0,#07131f 66%,#050b14 67%);box-shadow:0 0 55px rgba(39,225,255,.08) inset}
.resetStatus{font-size:12px;color:#9fbbd1}.resetDone{font-size:25px;font-weight:1000;color:#aaffc6}
.sosGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sosBtn{min-height:105px;text-align:left;border:1px solid #31455a;background:#0c1928;color:#fff;border-radius:20px;padding:14px;font-weight:1000}.sosBtn b{display:block;font-size:28px;margin-bottom:6px}.coach{background:#101d2c;border:1px solid #304a61;border-radius:20px;padding:16px}.steps{counter-reset:x;margin:12px 0 0;padding:0;list-style:none}.steps li{position:relative;padding:10px 8px 10px 43px;border-bottom:1px solid #203548;line-height:1.3}.steps li:last-child{border-bottom:0}.steps li:before{counter-increment:x;content:counter(x);position:absolute;left:4px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#17334b;color:#aaf3ff;font-weight:1000}
.weekGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.weekKid{background:#0a1725;border:1px solid #243d53;border-radius:17px;padding:12px}.score{font-size:27px;font-weight:1000;color:#aaffc6}
.dots{display:flex;gap:4px;margin-top:8px}.dot{width:18px;height:18px;border-radius:6px;background:#1b2a3b;border:1px solid #2c4155}.dot.ok{background:#26c96a;border-color:#43eb88}.dot.no{background:#6c2c32;border-color:#a4434c}.dot.future{opacity:.25}
.settingsBlock{border-top:1px solid #20364a;padding-top:12px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#02070d;border:1px solid #34506a;border-radius:14px;padding:11px 15px;font-weight:900;z-index:99;max-width:88%;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.42)}
.hidden{display:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:25px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.15}}
.sync{font-size:10px;color:#8ca5bc;margin-top:3px}
.empty{border:1px dashed #37536a;border-radius:17px;padding:13px;color:#9eb4c6;text-align:center}
@media(max-width:620px){
 .heroGrid{grid-template-columns:1fr}.gauge{width:150px}.rewardTitle{font-size:21px}.chestIcon{font-size:54px}
 .kids,.sosGrid,.weekGrid{grid-template-columns:1fr 1fr}.resetClock{font-size:55px}.resetRing{width:205px}
}
@media(max-width:420px){.kids{grid-template-columns:1fr}.weekGrid{grid-template-columns:1fr 1fr}.brand{font-size:19px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<div id="confetti" class="confetti hidden"></div>

<script>
const STORE="missionMaisonV2",PROF="missionMaisonCloudV1",ACTIVE="missionMaisonActive";
const API_DEFAULT="https://budget-pack-api.2ywtpfbvpb.workers.dev";
const clone=o=>JSON.parse(JSON.stringify(o));
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,"0");
const day=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromDay=s=>new Date(s+"T12:00:00");
const addDays=(s,n)=>{const d=fromDay(s);d.setDate(d.getDate()+n);return day(d)};
const uid=p=>p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);

const DEFAULT_CHILDREN=[
 {id:"c1",name:"Dylan",avatar:"🦸",points:0},{id:"c2",name:"Nolan",avatar:"🦖",points:0},
 {id:"c3",name:"Enfant 3",avatar:"🦄",points:0},{id:"c4",name:"Enfant 4",avatar:"🐼",points:0},
 {id:"c5",name:"Enfant 5",avatar:"🐯",points:0},{id:"c6",name:"Enfant 6",avatar:"🦊",points:0}
];
const DEFAULT_POOL=[
 "Ranger ta chambre",
 "Ramasser tes choses qui traînent",
 "Aider à mettre la table",
 "Mettre ton linge sale au panier",
 "Aider à vider le lave-vaisselle",
 "Ramasser le salon",
 "Préparer tes choses pour demain",
 "Aider 10 min dans une pièce commune"
];

const base={
 schemaVersion:2,children:clone(DEFAULT_CHILDREN),updatedAt:now(),
 qg:{version:4,settings:{defaultPrivilege:"📱 Écran / jeu",resetMinutes:10,missionPools:{}},days:{}}
};

const SOS={
 argue:{icon:"😤",title:"Il/elle s’obstine",steps:[
  "Donne une consigne courte et précise, une seule fois.",
  "Évite de partir dans un long débat. Répète calmement la règle.",
  "Rappelle : « Quand ta mission est faite, ton privilège revient. »"
 ]},
 refuse:{icon:"❌",title:"Refuse de faire la consigne",steps:[
  "Vérifie que la demande est claire et réaliste.",
  "Donne un choix limité : « Tu le fais maintenant ou dans 5 minutes. »",
  "Si c’est encore refusé, le privilège reste bloqué jusqu’à ce que ce soit fait."
 ]},
 respect:{icon:"🗯️",title:"Manque de respect",steps:[
  "Coupe la discussion avant qu’elle monte.",
  "Demande de reprendre la phrase correctement.",
  "Reviens à la consigne originale sans ajouter dix nouvelles conséquences."
 ]},
 screen:{icon:"📱",title:"Crise pour les écrans",steps:[
  "Reste sur la règle connue : responsabilités avant privilèges.",
  "Ne renégocie pas le temps d’écran pendant la crise.",
  "Quand la mission est faite et que le calme revient, le privilège peut revenir."
 ]},
 bedtime:{icon:"🌙",title:"Coucher difficile",steps:[
  "Garde toujours le même ordre : pyjama, dents, lit.",
  "Donne une seule étape à la fois.",
  "Évite les longues négociations une fois la routine commencée."
 ]},
 conflict:{icon:"🥊",title:"Conflit / frappe",steps:[
  "Sépare d’abord les enfants et assure-toi que tout le monde est en sécurité.",
  "Attends que le calme revienne avant de chercher qui a commencé.",
  "Fais réparer le geste ensuite : excuse, remettre en ordre, aider ou autre réparation logique."
 ]}
};

function load(){
 try{
  const x=JSON.parse(localStorage.getItem(STORE)||"null");
  if(x&&typeof x==="object")return normalize(x);
 }catch{}
 return normalize(clone(base));
}
function loadProf(){
 try{return JSON.parse(localStorage.getItem(PROF))||{apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0}}
 catch{return{apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0}}
}
function normalize(x){
 if(!x||typeof x!=="object")x=clone(base);
 if(!Array.isArray(x.children)||!x.children.length)x.children=clone(DEFAULT_CHILDREN);
 x.qg=x.qg||{};
 x.qg.version=4;
 x.qg.settings=x.qg.settings||{};
 if(!x.qg.settings.defaultPrivilege)x.qg.settings.defaultPrivilege="📱 Écran / jeu";
 if(!Number(x.qg.settings.resetMinutes))x.qg.settings.resetMinutes=10;
 x.qg.settings.missionPools=x.qg.settings.missionPools||{};
 x.qg.days=x.qg.days||{};
 return x;
}

let data=load(),profile=loadProf(),view="qg",busy=false,dirty=false,syncTimer=null;
let active=localStorage.getItem(ACTIVE)||data.children[0]?.id||"c1";
let rewardEditor=false,sosOpen=null,wakeLock=null,audioCtx=null,resetInterval=null,lastUnlocked=false;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(s){const e=document.querySelector("#toast");if(!e)return;e.textContent=s;e.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hidden"),2600)}
function save(localOnly=false){
 data.updatedAt=now();localStorage.setItem(STORE,JSON.stringify(data));render();
 if(!localOnly&&profile.token){dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,300)}
}
function saveProf(){localStorage.setItem(PROF,JSON.stringify(profile))}
function editingField(){const e=document.activeElement;return !!e&&e.matches&&e.matches("input,textarea,select")}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}

function poolFor(cid){
 const p=data.qg.settings.missionPools[cid];
 return Array.isArray(p)&&p.length?p:DEFAULT_POOL;
}
function ensureDay(dateStr=day()){
 let d=data.qg.days[dateStr];
 if(!d){
  d={date:dateStr,reward:null,missions:{},reset:{minutes:Number(data.qg.settings.resetMinutes||10),status:"idle",startedAt:null,endAt:null,completedAt:null}};
  data.qg.days[dateStr]=d;
 }
 d.missions=d.missions||{};
 d.reset=d.reset||{minutes:Number(data.qg.settings.resetMinutes||10),status:"idle",startedAt:null,endAt:null,completedAt:null};
 if(!Number(d.reset.minutes))d.reset.minutes=10;
 data.children.forEach((c,i)=>{
  if(!d.missions[c.id]){
   const pool=poolFor(c.id),pick=pool[hash(dateStr+"|"+c.id+"|"+i)%pool.length];
   d.missions[c.id]={text:pick,done:false,doneAt:null,privilege:data.qg.settings.defaultPrivilege||"📱 Écran / jeu"};
  }
 });
 return d;
}
function todayData(){return ensureDay(day())}
function doneCount(d=todayData()){return data.children.filter(c=>d.missions[c.id]?.done).length}
function allDone(d=todayData()){return data.children.length>0&&doneCount(d)===data.children.length}
function energy(d=todayData()){
 const missionPart=data.children.length?Math.round(doneCount(d)/data.children.length*60):0;
 const resetPart=d.reset.status==="done"?40:0;
 return Math.min(100,missionPart+resetPart);
}
function unlocked(d=todayData()){return !!d.reward&&allDone(d)&&d.reset.status==="done"}
function missionEnergyPerKid(){return data.children.length?Math.round(60/data.children.length):0}

function topbar(title="QG FAMILLE"){
 return '<div class="topbar"><div class="logo"><div class="logoMark">⚡</div><div><div class="brand">MISSION MAISON — '+title+'</div>'+
 '<div class="sub">'+new Date().toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long"})+'</div>'+
 '<div class="sync">'+(profile.token?"☁️ Synchronisé · "+esc(profile.memberName||"Famille"):"📱 Mode local")+'</div></div></div>'+
 '<button class="iconBtn" onclick="view=\'settings\';render()">⚙️</button></div>';
}
function nav(){
 const items=[["qg","🏠","QG"],["reset","🔥","Reset"],["sos","🆘","SOS"],["week","🏆","Semaine"]];
 return '<div class="nav">'+items.map(([v,i,l])=>'<button class="'+(view===v?"on":"")+'" onclick="view=\''+v+'\';render()"><span>'+i+'</span>'+l+'</button>').join("")+'</div>';
}

function rewardHero(){
 const d=todayData(),p=energy(d),isOpen=unlocked(d),reward=d.reward;
 const title=reward?((reward.emoji||"🎁")+" "+reward.title):"🎁 Choisis la grosse récompense du soir";
 const hint=reward
  ?(isOpen?"DÉBLOQUÉE! La maison a réussi sa mission 💥":"Visible dès maintenant, mais le coffre reste barré jusqu’après le Reset du soir.")
  :"Le matin, colle ici le code que je te donne.";
 return '<div class="hero"><div class="rewardTop"><div><div class="kicker">🎁 GROSSE RÉCOMPENSE DU JOUR</div><div class="rewardTitle">'+esc(title)+'</div><div class="rewardHint">'+esc(hint)+'</div></div>'+
 '<div class="lockPill '+(isOpen?"open":"")+'">'+(isOpen?"🔓 DÉBLOQUÉE":"🔒 VERROUILLÉE")+'</div></div>'+
 '<div class="heroGrid"><div class="gauge" style="--p:'+p+'%"><div class="gaugeIn"><div class="pct">'+p+'%</div><div class="pctLabel">ÉNERGIE MAISON</div></div></div>'+
 '<div><div class="chest '+(isOpen?"open":"")+'"><div class="chestIcon">'+(isOpen?"🏆":"🧰")+'</div><div><div class="kicker">'+(isOpen?"COFFRE OUVERT":"COFFRE DU SOIR")+'</div><div style="font-weight:1000;font-size:18px;margin-top:4px">'+(isOpen?"BRAVO L’ÉQUIPE!":"Missions + Reset 10 min")+'</div><div class="tiny" style="margin-top:5px">'+(allDone(d)?"✅ Toutes les petites missions sont faites":"🔒 Il reste "+(data.children.length-doneCount(d))+" petite(s) mission(s)")+'<br>'+(d.reset.status==="done"?"✅ Reset du soir terminé":"🔒 Reset du soir pas encore terminé")+'</div></div></div>'+
 '<div class="progressMeta"><div class="metaBox"><div class="metaBig">'+doneCount(d)+' / '+data.children.length+'</div><div class="metaSmall">missions enfants</div></div><div class="metaBox"><div class="metaBig">'+(d.reset.status==="done"?"✅":"🔒")+'</div><div class="metaSmall">Reset du soir</div></div></div></div></div>'+
 '<div class="row space" style="margin-top:12px"><button class="btn small" onclick="toggleRewardEditor()">'+(reward?"✏️ Changer la récompense":"➕ Ajouter la récompense")+'</button><div class="tiny">Chaque mission ≈ +'+missionEnergyPerKid()+'% · Reset = +40%</div></div>'+
 '<div class="rewardEditor '+(rewardEditor?"on":"")+'"><textarea id="rewardCode" placeholder="Colle le code ici..."></textarea><div class="row" style="margin-top:8px"><button class="btn gold" onclick="importReward()">✨ Importer la récompense</button><button class="btn" onclick="rewardEditor=false;render()">Annuler</button></div>'+
 '<div class="codeHelp">Format : MAISON|RECOMPENSE|2026-11-13|🍿|Soirée film + popcorn|RESET=10</div></div></div>';
}
function toggleRewardEditor(){rewardEditor=!rewardEditor;render();if(rewardEditor)setTimeout(()=>document.querySelector("#rewardCode")?.focus(),80)}
function importReward(){
 const raw=(document.querySelector("#rewardCode")?.value||"").trim();
 if(!raw)return toast("Colle le code de récompense");
 const parts=raw.split("|").map(s=>s.trim());
 if((parts[0]||"").toUpperCase()!=="MAISON"||(parts[1]||"").toUpperCase()!=="RECOMPENSE")return toast("Code non reconnu");
 let idx=2,dateStr=day();
 if(/^\d{4}-\d{2}-\d{2}$/.test(parts[idx]||"")){dateStr=parts[idx];idx++}
 const emoji=parts[idx]||"🎁",title=parts[idx+1]||"Récompense surprise";
 const opts=parts.slice(idx+2);
 let reset=10;
 opts.forEach(x=>{const [k,v]=x.split("=");if((k||"").toUpperCase()==="RESET"&&Number(v)>0)reset=Number(v)});
 const d=ensureDay(dateStr);d.reward={emoji,title,createdAt:now()};d.reset.minutes=reset;
 rewardEditor=false;save();toast("🎁 Récompense du jour ajoutée!");
}
function editRewardManual(){
 const d=todayData(),title=prompt("Récompense du jour :",d.reward?.title||"");
 if(title===null)return;const emoji=prompt("Emoji :",d.reward?.emoji||"🎁");if(emoji===null)return;
 d.reward={title:title.trim()||"Récompense",emoji:emoji.trim()||"🎁",createdAt:now()};save();
}

function kidCard(c){
 const d=todayData(),m=d.missions[c.id],done=!!m.done;
 return '<div class="kid '+(done?"done":"")+'"><div class="kidHead"><div class="avatar">'+esc(c.avatar||"🙂")+'</div><div><div class="kidName">'+esc(c.name)+'</div><div class="tiny">'+(done?"Mission accomplie ✅":"Mission du jour")+'</div></div></div>'+
 '<div class="mission">'+esc(m.text)+'</div><div class="row space"><span class="priv '+(done?"open":"")+'">'+(done?"🔓 ":"🔒 ")+esc(m.privilege||data.qg.settings.defaultPrivilege)+'</span>'+
 '<button class="btn small" onclick="editMission(\''+c.id+'\')">✏️</button></div>'+
 '<button class="btn big '+(done?"":"good")+'" style="margin-top:10px" onclick="toggleMission(\''+c.id+'\')">'+(done?"↩️ Annuler":"✅ Mission faite")+'</button></div>';
}
function toggleMission(cid){
 const d=todayData(),m=d.missions[cid];if(!m)return;
 const was=unlocked(d);m.done=!m.done;m.doneAt=m.done?now():null;save();
 const is=unlocked(d);
 if(!was&&is){celebrate();setTimeout(()=>toast("🏆 COFFRE DÉBLOQUÉ!"),150)}
}
function editMission(cid){
 const d=todayData(),m=d.missions[cid],c=data.children.find(x=>x.id===cid);if(!m||!c)return;
 const t=prompt("Mission de "+c.name+" aujourd’hui :",m.text);if(t===null)return;
 const p=prompt("Petit privilège débloqué quand c’est fait :",m.privilege||data.qg.settings.defaultPrivilege);if(p===null)return;
 m.text=t.trim()||m.text;m.privilege=p.trim()||data.qg.settings.defaultPrivilege;save();
}

function qgView(){
 const d=todayData();
 return topbar()+rewardHero()+
 '<div class="card"><div class="sectionTitle"><h2>👧👦 Missions du jour</h2><div class="tiny">Responsabilités avant privilèges</div></div>'+
 '<div class="kids">'+data.children.map(kidCard).join("")+'</div></div>'+
 '<div class="card"><button class="btn big cyan" onclick="view=\'reset\';render()">🔥 Lancer le RESET MAISON — '+d.reset.minutes+' MIN</button>'+
 '<button class="btn big purple" style="margin-top:8px" onclick="view=\'sos\';render()">🆘 Un enfant s’obstine? SOS PARENT</button></div>';
}

function ensureAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch{}}
function tone(freq=880,duration=380,delay=0){
 ensureAudio();setTimeout(()=>{try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;o.type="sine";g.gain.value=.16;o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration/1000);o.stop(audioCtx.currentTime+duration/1000)}catch{}},delay)
}
function endSound(){[0,520,1040,1560].forEach((d,i)=>tone(i%2?1040:800,420,d));try{navigator.vibrate?.([300,140,300,140,650])}catch{}}
async function requestWake(){try{if("wakeLock" in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}}catch{wakeLock=null}}
async function releaseWake(){try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch{wakeLock=null}}
function remainingReset(d=todayData()){
 if(d.reset.status!=="active"||!d.reset.endAt)return 0;
 return Math.max(0,new Date(d.reset.endAt).getTime()-Date.now());
}
function formatClock(ms){const sec=Math.ceil(ms/1000),m=Math.floor(sec/60),s=sec%60;return pad(m)+":"+pad(s)}
function startReset(){
 const d=todayData();ensureAudio();d.reset.status="active";d.reset.startedAt=now();d.reset.completedAt=null;d.reset.endAt=new Date(Date.now()+Number(d.reset.minutes||10)*60000).toISOString();
 requestWake();save();startResetTicker();toast("🔥 RESET lancé! Tout le monde aide!");
}
function addResetMinutes(n){
 const d=todayData();if(d.reset.status!=="active")return;
 d.reset.endAt=new Date(new Date(d.reset.endAt).getTime()+n*60000).toISOString();save();
}
function finishReset(){
 const d=todayData();if(d.reset.status==="done")return;
 const was=unlocked(d);d.reset.status="done";d.reset.completedAt=now();d.reset.endAt=null;releaseWake();endSound();save();
 const is=unlocked(d);celebrate();
 toast(is?"🏆 RESET TERMINÉ — COFFRE OUVERT!":"🔥 Reset terminé! Il reste des missions à faire.");
}
function cancelReset(){const d=todayData();d.reset.status="idle";d.reset.startedAt=null;d.reset.endAt=null;d.reset.completedAt=null;releaseWake();save()}
function resetReset(){const d=todayData();d.reset.status="idle";d.reset.startedAt=null;d.reset.endAt=null;d.reset.completedAt=null;save()}
function startResetTicker(){
 clearInterval(resetInterval);
 resetInterval=setInterval(()=>{
  const d=todayData();
  if(d.reset.status!=="active"){clearInterval(resetInterval);return}
  const ms=remainingReset(d),el=document.querySelector("#resetClock");if(el)el.textContent=formatClock(ms);
  if(ms<=0){clearInterval(resetInterval);finishReset()}
 },500);
}
function resetView(){
 const d=todayData(),st=d.reset.status,ms=remainingReset(d);
 if(st==="active")setTimeout(()=>{requestWake();startResetTicker()},30);
 let body="";
 if(st==="idle")body='<div class="resetHero"><div class="kicker">🔥 DÉFI FAMILIAL DU SOIR</div><div class="resetRing"><div><div style="font-size:55px">🏠</div><div class="resetClock">'+pad(d.reset.minutes)+':00</div></div></div><div style="font-size:22px;font-weight:1000">Tout le monde range pendant '+d.reset.minutes+' minutes</div><div class="resetStatus" style="margin:7px 0 15px">L’écran reste éveillé pendant le chrono et un son joue à la fin.</div><button class="btn big cyan" onclick="startReset()">▶️ DÉMARRER LE RESET</button></div>';
 if(st==="active")body='<div class="resetHero"><div class="kicker">⚡ RESET EN COURS</div><div class="resetRing"><div><div style="font-size:48px">🔥</div><div id="resetClock" class="resetClock">'+formatClock(ms)+'</div></div></div><div style="font-size:22px;font-weight:1000">GO GO GO! On fait monter la maison!</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="addResetMinutes(5)">+5 min</button><button class="btn bad" onclick="cancelReset()">Arrêter</button></div></div>';
 if(st==="done")body='<div class="resetHero"><div class="kicker">RESET TERMINÉ</div><div class="resetRing"><div><div style="font-size:70px">'+(unlocked(d)?"🏆":"✅")+'</div><div class="resetDone">'+(unlocked(d)?"COFFRE OUVERT!":"RESET RÉUSSI!")+'</div></div></div><div style="font-size:20px;font-weight:1000">'+(unlocked(d)?esc((d.reward?.emoji||"🎁")+" "+(d.reward?.title||"Récompense")):"Il reste "+(data.children.length-doneCount(d))+" mission(s) avant la grosse récompense.")+'</div><button class="btn big" style="margin-top:14px" onclick="resetReset()">↻ Refaire un Reset</button></div>';
 return topbar("RESET MAISON")+'<div class="card">'+body+'</div><div class="card"><div class="sectionTitle"><h2>⚡ Énergie actuelle</h2><b>'+energy(d)+'%</b></div><div class="tiny">'+doneCount(d)+'/'+data.children.length+' missions faites · Reset '+(st==="done"?"terminé ✅":st==="active"?"en cours 🔥":"pas commencé 🔒")+'</div></div>';
}

function sosView(){
 if(sosOpen){
  const s=SOS[sosOpen];
  return topbar("SOS PARENT")+'<div class="card coach"><div class="row space"><div><div class="kicker">QUOI FAIRE MAINTENANT</div><h2 style="margin:4px 0">'+s.icon+' '+esc(s.title)+'</h2></div><button class="btn small" onclick="sosOpen=null;render()">← Retour</button></div><ol class="steps">'+s.steps.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>'+

 Object.entries(SOS).map(([k,s])=>'<button class="sosBtn" onclick="sosOpen=\''+k+'\';render()"><b>'+s.icon+'</b>'+esc(s.title)+'</button>').join("")+'</div></div>';

function mondayOf(s){const d=fromDay(s),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return day(d)}
function weekRange(){
 const start=mondayOf(day()),dates=[];for(let i=0;i<7;i++)dates.push(addDays(start,i));return dates;
}
function childWeek(cid){
 const dates=weekRange();let done=0,possible=0;
 const dots=dates.map(dt=>{
  if(dt>day())return "future";
  const dd=data.qg.days[dt];if(!dd)return "empty";
  possible++;if(dd.missions?.[cid]?.done){done++;return "ok"}return "no";
 });
 return {done,possible,dots};
}
function familyWeek(){
 const dates=weekRange();let success=0,possible=0;
 dates.forEach(dt=>{if(dt>day())return;const d=data.qg.days[dt];if(!d)return;possible++;if(unlocked(d))success++});
 return {success,possible};
}
function weekView(){
 const fw=familyWeek(),dates=weekRange();
 return topbar("SEMAINE")+'<div class="card"><div class="kicker">🏆 ÉQUIPE MAISON</div><div style="font-size:34px;font-weight:1000;margin-top:4px">'+fw.success+' jour(s) réussi(s)</div><div class="tiny">Une journée réussie = toutes les missions + Reset du soir.</div></div>'+
 '<div class="card"><div class="sectionTitle"><h2>👧👦 Chacun fait sa part</h2><div class="tiny">Pas de classement</div></div><div class="weekGrid">'+data.children.map(c=>{const w=childWeek(c.id);return '<div class="weekKid"><div class="row space"><div><b>'+esc(c.avatar)+' '+esc(c.name)+'</b><div class="tiny">missions faites</div></div><div class="score">'+w.done+'</div></div><div class="dots">'+w.dots.map((x,i)=>'<div class="dot '+(x==="ok"?"ok":x==="no"?"no":x==="future"?"future":"")+'" title="'+dates[i]+'"></div>').join("")+'</div></div>'}).join("")+'</div></div>'+
 '<div class="card"><div class="sectionTitle"><h2>🎁 Récompenses de la semaine</h2></div>'+dates.filter(dt=>dt<=day()).map(dt=>{const d=data.qg.days[dt];if(!d?.reward)return "";return '<div class="row space" style="padding:9px 0;border-bottom:1px solid #1c3245"><span class="tiny">'+dt+'</span><b>'+esc((d.reward.emoji||"🎁")+" "+d.reward.title)+'</b><span>'+(unlocked(d)?"🔓":"🔒")+'</span></div>'}).join("")+'</div>';
}

function editChild(cid){
 const c=data.children.find(x=>x.id===cid);if(!c)return;
 const n=prompt("Nom :",c.name);if(n===null)return;const a=prompt("Emoji :",c.avatar||"🙂");if(a===null)return;
 c.name=n.trim()||c.name;c.avatar=a.trim()||c.avatar;save();
}
function editPool(cid){
 const c=data.children.find(x=>x.id===cid);if(!c)return;
 const current=poolFor(cid).join("\n");
 const v=prompt("Missions possibles de "+c.name+"\\nUne mission par ligne :",current);
 if(v===null)return;const arr=v.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 if(arr.length)data.qg.settings.missionPools[cid]=arr;save();toast("Missions enregistrées");
}
function settingsView(){
 return topbar("RÉGLAGES")+
 '<div class="card"><div class="sectionTitle"><h2>⚙️ Réglages simples</h2></div><label class="tiny">Petit privilège par défaut</label><input id="defaultPriv" value="'+esc(data.qg.settings.defaultPrivilege)+'" oninput="draftSetting()"><label class="tiny" style="display:block;margin-top:10px">Durée du Reset</label><select id="resetMins" onchange="draftSetting()">'+[5,10,15,20].map(n=>'<option value="'+n+'" '+(Number(data.qg.settings.resetMinutes)===n?"selected":"")+'>'+n+' minutes</option>').join("")+'</select><button class="btn good big" style="margin-top:10px" onclick="saveSettings()">Enregistrer</button></div>'+
 '<div class="card"><div class="sectionTitle"><h2>👧👦 Enfants et missions</h2></div>'+data.children.map(c=>'<div class="row space" style="padding:10px 0;border-bottom:1px solid #1d3448"><b>'+esc(c.avatar)+' '+esc(c.name)+'</b><div class="row"><button class="btn small" onclick="editPool(\''+c.id+'\')">📋 Missions</button><button class="btn small" onclick="editChild(\''+c.id+'\')">✏️ Enfant</button></div></div>').join("")+'</div>'+
 familySettings();
}
let settingDraft=null;
function draftSetting(){settingDraft={priv:document.querySelector("#defaultPriv")?.value||"",mins:Number(document.querySelector("#resetMins")?.value||10)}}
function saveSettings(){
 const p=document.querySelector("#defaultPriv")?.value.trim()||"📱 Écran / jeu",m=Number(document.querySelector("#resetMins")?.value||10);
 data.qg.settings.defaultPrivilege=p;data.qg.settings.resetMinutes=m;
 const d=todayData();if(d.reset.status==="idle")d.reset.minutes=m;
 Object.values(d.missions).forEach(x=>{if(!x.privilege)x.privilege=p});
 settingDraft=null;save();toast("Réglages enregistrés ✅");
}

function familySettings(){
 if(profile.token)return '<div class="card"><div class="sectionTitle"><h2>☁️ Partage famille</h2><span class="lockPill open">CONNECTÉ</span></div><div class="tiny">Code famille</div><div style="font-size:29px;font-weight:1000;letter-spacing:4px;color:#aaf3ff;margin:6px 0">'+esc(profile.joinCode||"")+'</div><button class="btn big" onclick="pullCloud(true)">🔄 Synchroniser</button><button class="btn bad big" style="margin-top:8px" onclick="leaveFamily()">Déconnecter cet appareil</button></div>';
 return '<div class="card"><div class="sectionTitle"><h2>☁️ Partager avec l’autre parent</h2></div><input id="memberName" placeholder="Ton nom"><button class="btn cyan big" style="margin-top:8px" onclick="createFamily()">Créer la famille</button><div style="height:14px"></div><input id="joinName" placeholder="Nom de cet appareil"><input id="joinCode" style="margin-top:7px" placeholder="CODE FAMILLE"><button class="btn good big" style="margin-top:8px" onclick="joinFamily()">Rejoindre</button></div>';
}

function celebrate(){
 const box=document.querySelector("#confetti");if(!box)return;
 box.innerHTML="";box.classList.remove("hidden");
 const chars=["⭐","⚡","🎉","✨","🏆","💥"];
 for(let i=0;i<28;i++){
  const e=document.createElement("i");e.textContent=chars[i%chars.length];e.style.left=(Math.random()*100)+"%";e.style.animationDelay=(Math.random()*.55)+"s";e.style.animationDuration=(1.4+Math.random()*1)+"s";box.appendChild(e);
 }
 setTimeout(()=>box.classList.add("hidden"),2600);
}

function apiBase(){return API_DEFAULT}
async function parseResponse(r){let j={};try{j=await r.json()}catch{}if(!r.ok){const e=new Error(j.error||("Erreur "+r.status));e.status=r.status;e.data=j;throw e}return j}
async function api(path,opt={}){
 const headers={Accept:"application/json",...(opt.headers||{})};
 if(opt.body)headers["Content-Type"]=profile.token?"application/json":"text/plain;charset=UTF-8";
 if(profile.token)headers.Authorization="Bearer "+profile.token;
 const r=await fetch(apiBase()+path,{method:opt.method||"GET",body:opt.body,headers,mode:"cors",cache:"no-store",redirect:"follow"});
 return parseResponse(r);
}
async function createFamily(){
 profile.memberName=(document.querySelector("#memberName")?.value||"Parent").trim()||"Parent";
 try{
  const j=await api("/api/family/create",{method:"POST",body:JSON.stringify({familyName:"Mission Maison",memberName:profile.memberName,timezone:"America/Toronto"})});
  Object.assign(profile,{token:j.token,memberId:j.memberId,familyId:j.familyId,joinCode:j.joinCode,cloudVersion:j.version||0});
  saveProf();dirty=true;await pushCloud();render();toast("Famille créée ✅");
 }catch(e){toast("Impossible : "+e.message)}
}
async function joinFamily(){
 profile.memberName=(document.querySelector("#joinName")?.value||"Parent").trim()||"Parent";
 const code=(document.querySelector("#joinCode")?.value||"").trim().toUpperCase();if(!code)return toast("Entre le code famille");
 try{
  const j=await api("/api/family/join",{method:"POST",body:JSON.stringify({joinCode:code,memberName:profile.memberName})});
  Object.assign(profile,{token:j.token,memberId:j.memberId,familyId:j.familyId,joinCode:j.joinCode,cloudVersion:0});
  saveProf();dirty=false;await pullCloud(true);view="qg";render();toast("Famille rejointe ✅");
 }catch(e){toast("Impossible : "+e.message)}
}
async function pushCloud(){
 if(!profile.token||busy)return;busy=true;
 try{
  const j=await api("/api/state",{method:"PUT",body:JSON.stringify({version:Number(profile.cloudVersion||0),data})});
  profile.cloudVersion=Number(j.version||0);saveProf();dirty=false;
 }catch(e){
  if(e.status===409&&e.data?.data){data=normalize(e.data.data);profile.cloudVersion=Number(e.data.version||0);saveProf();dirty=false;localStorage.setItem(STORE,JSON.stringify(data));render();toast("Une modification est arrivée de l’autre appareil — réessaie")}
  else toast("Sync à vérifier");
 }finally{busy=false}
}
async function pullCloud(force=false){
 if(!profile.token||busy||(dirty&&!force))return;
 if(editingField()&&!force)return;
 busy=true;
 try{
  const j=await api("/api/state");
  if(j.data&&typeof j.data==="object"){data=normalize(j.data);profile.cloudVersion=Number(j.version||0);saveProf();ensureDay(day());localStorage.setItem(STORE,JSON.stringify(data));render()}
 }catch(e){if(force)toast("Sync impossible : "+e.message)}
 finally{busy=false}
}
function leaveFamily(){
 if(!confirm("Déconnecter cet appareil de la famille?"))return;
 profile={apiUrl:API_DEFAULT,token:"",memberId:"",familyId:"",memberName:"",joinCode:"",cloudVersion:0};saveProf();render();
}

function render(){
 ensureDay(day());
 let body=view==="qg"?qgView():view==="reset"?resetView():view==="sos"?sosView():view==="week"?weekView():settingsView();
 document.querySelector("#app").innerHTML='<div class="wrap">'+body+'</div>'+nav();
 if(view==="reset"&&todayData().reset.status==="active")startResetTicker();
}
ensureDay(day());
localStorage.setItem(STORE,JSON.stringify(data));saveProf();render();
if(profile.token)pullCloud(true);
setInterval(()=>{if(profile.token&&document.visibilityState==="visible"&&!editingField())pullCloud()},7000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){const d=todayData();if(d.reset.status==="active"){requestWake();startResetTicker()}if(profile.token&&!editingField())pullCloud(true)}else if(todayData().reset.status!=="active"){releaseWake()}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
